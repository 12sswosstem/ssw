name: Component Parity Check

on:
  push:
    branches: [main]
    paths:
      - "components/**.md"
      - "scripts/verify-parity.mjs"
      - ".github/workflows/parity.yml"
  pull_request:
    paths:
      - "components/**.md"
      - "scripts/verify-parity.mjs"
  schedule:
    - cron: "0 0 * * 1"  # Weekly Mon 00:00 UTC — catches Figma-side drift
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run parity check
        id: check
        env:
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          FIGMA_FILE_KEY: ${{ vars.FIGMA_FILE_KEY }}
        run: node scripts/verify-parity.mjs
        continue-on-error: true

      - name: Upload parity report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parity-report
          path: parity-report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.existsSync('parity-report.md')
              ? fs.readFileSync('parity-report.md', 'utf8')
              : '⚠ parity-report.md not generated.';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if drift
        if: steps.check.outcome == 'failure'
        run: |
          echo "::error::Parity drift detected. Check the parity-report artifact or PR comment."
          exit 1
