<style>

const DOCS = {"README.md": "# SSW — Osstem Implant Design System\n\n피그마 디자인시스템의 토큰과 컴포넌트 스펙을 코드로 관리합니다.\n\n## 구조\n\n```\nssw/\n├── tokens/          # Figma → JS 디자인 토큰\n│   ├── color/       # primitive · semantic · component (3계층)\n│   ├── number/      # 간격·사이즈 스케일\n│   └── typography/  # font-family · font-size · text-style ID\n├── components/      # 컴포넌트별 스펙 MD\n└── icons/           # 아이콘 라이브러리 ID 매핑\n```\n\n## 사용 예\n\n```js\nimport { colorSemantic } from \"./tokens/index.js\";\n\nconst brandColor = colorSemantic.brand.A_default; // #EB6100\n```\n\n## Figma 소스\n\n| 파일 | Key |\n|---|---|\n| 공통 컴포넌트 | `5MV87M6oIKlLf7Pg35VSJI` |\n| UI-Kit-Guide | `LxBPQF1oFOfiNdX5qzLcik` |\n\n## 컴포넌트 목록\n\n[components/](./components) 폴더 참고.\n", "components/README.md": "# Components\n\nOsstem Implant 디자인시스템 컴포넌트 학습 문서.\n각 MD는 `figma-export.json`(2026-05-04 export)에서 추출한 색상·숫자 토큰과 typography 스타일 기준으로 작성됨.\n\n> **범위**: `tokens/color/component.js`와 `tokens/number/component.js`에 선언된 모든 컴포넌트 namespace를 1:1 매핑.\n\n## 목록 (36개)\n\n> 2026-05-07 업데이트:\n> - `coachmark` 제거 (실제 Figma 디자인시스템 미존재 — placeholder였음)\n> - `Context Menu` 제거 — base [Menu](./menu.md) 컴포넌트의 trigger 패턴일 뿐, 별도 spec 불필요. 우클릭/⋯ overflow/액션 메뉴 등 모든 메뉴형 사용은 menu doc 참조.\n\n### Form / Input\n| 컴포넌트 | 토큰 키 |\n|---|---|\n| [Button](./button.md) | `button` |\n| [Input (TextInput)](./input.md) | `input` (text input + input common) |\n| [Textarea](./textarea.md) | `textarea` (input 토큰 공유) |\n| [Dropdown](./dropdown.md) | `dropdown` (input_(dropdown)) |\n| [Value Stepper](./value-stepper.md) | `valueStepper` |\n\n### Selection\n| 컴포넌트 | 토큰 키 |\n|---|---|\n| [Checkbox](./checkbox.md) | `checkbox` (control 공유) |\n| [Radio](./radio.md) | `radio` (control 공유) |\n| [Switch](./switch.md) | `switchControl` (control 공유) |\n\n### Navigation\n| 컴포넌트 | 토큰 키 |\n|---|---|\n| [Tab](./tab.md) | `tab` (line_tab + contained_tab) |\n| [Segmented Control](./segmented-control.md) | `segmentedControl` |\n| [Menu](./menu.md) | `menu` (prefix `menu/*`, 우클릭/overflow/action 모두 공유) |\n| [Breadcrumb](./breadcrumb.md) | `breadcrumb` |\n| [GNB](./gnb.md) | `gnb` |\n| [Toolbar](./toolbar.md) | `toolbar` |\n\n### Display\n| 컴포넌트 | 토큰 키 |\n|---|---|\n| [Tag](./tag.md) | `tag` |\n| [Chip](./chip.md) | `chip` |\n| [Badge](./badge.md) | `badge` |\n| [Avatar](./avatar.md) | `avatar` |\n| [Divider](./divider.md) | `divider` |\n| [Rating](./rating.md) | `rating` |\n\n### Layout\n| 컴포넌트 | 토큰 키 |\n|---|---|\n| [Card](./card.md) | `card` |\n| [Reservation Card](./reservation-card.md) | `reservationCard` |\n| [Table](./table.md) | `table` |\n| [List](./list.md) | `list` |\n| [Expandable List](./expandable-list.md) | `expandableList` |\n| [HMI](./hmi.md) | `hmi` |\n\n### Feedback\n| 컴포넌트 | 토큰 키 |\n|---|---|\n| [Tooltip](./tooltip.md) | `tooltip` |\n| [Popover](./popover.md) | `popover` |\n| [Popup](./popup.md) | `popup` |\n| [Modal](./modal.md) | `modal` |\n| [Notification](./notification.md) | `notification` |\n| [Progress](./progress.md) | `progress` (circle & bar) |\n| [Progress Stepper](./progress-stepper.md) | `progress` (단계별) |\n| [Spinner](./spinner.md) | `spinner` (무한 로딩) |\n| [Slider](./slider.md) | `slider` |\n\n### Calendar / Date\n| 컴포넌트 | 토큰 키 |\n|---|---|\n| [Calendar](./calendar.md) | `calendar` |\n\n## MD 작성 규칙\n\n각 컴포넌트 MD는 다음 섹션을 포함:\n\n1. **Overview** — 토큰 collection 출처, 모드(light/dark)\n2. **Number tokens** — size·padding·radius·border (단위 px)\n3. **Color tokens** — 모드별 hex (light/dark)\n4. **Typography** — 사용되는 textStyle 이름·weight·size·line-height (해당 시)\n5. **Variants / States** — 토큰 이름에서 추출 가능한 state·variant 목록\n6. **Usage Notes** — 적용 시 주의사항\n\n## 출처\n\n- `figma-export.json` (2026-05-04 export, file: `공통 컴포넌트 (Copy)`)\n- Figma Variable Collections:\n  - Color_component (`896:76023`) — light·dark\n  - Color_primitive (`642:26063`) — Static palette\n  - Color_semantic (`966:86157`) — alert·common·brand\n  - Number_component (`923:58268`) — Mode 1\n  - Number_sementic (`43:18571`) — Size·Typography\n- 일부 컴포넌트는 production Figma 노드 `get_variable_defs` 직접 참조 (button.md 참고)\n", "components/avatar.md": "# Avatar\n\n> 출처:\n> - **공통 컴포넌트(Copy)** file `lIIen1jmIhT0vuyXCMQDQA` / section `1871:77161` `Avatar_v0.3` (54 variants)\n> - **UI-Kit-Guide** file `ky00DVb1Q3RmiMlYWwdSGG` / page `1:69280` (가이드 페이지)\n> - `figma-export.json` (2026-05-04 export) Number_component\n>\n> JS 토큰: `tokens/color/component.js#avatar`, `tokens/number/component.js#avatar`.\n> 토큰 prefix: `avatar/*` + 공통 `common/avatar-bg-default`.\n\n## Overview\n\n가이드 verbatim:\n> \"아바타는 컨테이너 안에 아이콘, 이미지 또는 이니셜을 사용하여 사람, 회사 또는 단체를 나타냅니다. 사용자 프로필, 연락처 목록, 메시징 인터페이스 등 이미지나 아이콘이 필요한 곳에서 흔히 사용됩니다. 아바타는 사용자가 개인이나 그룹을 쉽게 식별할수 있도록 시각적 단서를 제공합니다.\"\n\n- atom 컴포넌트 셋: `1866:71484` `avatar_atom` (54 variants = 3 type × 3 style × 6 size)\n- group 컴포넌트 셋: `1871:77789` `avatar_group` (4 variants — Property 1: 1 single / 2 group / 3 group / 4 group)\n- array 컴포넌트 셋: `4270:111923` `avatar array` (12 variants — type spread/stack × size 6단계)\n\n## Number tokens (Mode 1)\n\n### corner radius (px)\n| shape | token | radius |\n|---|---|---|\n| circle | `avatar/corner radius/circle` | 999 |\n| rounded | `avatar/corner radius/rounded` | 12 |\n| rounded-ring | `avatar/corner radius/rounded-ring` | 14 |\n| square | `avatar/corner radius/square` | 0 |\n\n### stroke (border 굵기, px)\n| size | token | stroke |\n|---|---|---|\n| xs_24 | `avatar/stroke/xs` | 1 |\n| sm_32 | `avatar/stroke/sm` | 1.6 |\n| md_40 | `avatar/stroke/md` | 2.2 |\n| lg_48 | `avatar/stroke/lg` | 2.6 |\n| xl_64 | `avatar/stroke/xl` | 3 |\n| 2xl_80 | `avatar/stroke/2xl` | 4.2 |\n\n## Color tokens\n\n### 공통 (background)\n| token | light |\n|---|---|\n| `common/avatar-bg-default` | `#c6c6c6` |\n\n> default type(이미지/이니셜 없는 회색 사람 아이콘 아바타)의 배경색. light 모드 기준 단일값.\n\n### 토큰 미바인딩 영역\n- 이니셜 텍스트 색상, image 콘텐츠 색상, ring 색상은 **DS color 토큰 미바인딩**\n- 인스턴스 fill 또는 image content로 처리 → `importComponentSetByKeyAsync` 사용 강제\n- profile placeholder string: `Avatar profile/Man_Adult` (콘텐츠 슬롯)\n\n## Atom — 3축 Variants × 54 IDs\n\n### Variant 매트릭스\n\nprop 형식: `type={default|image|initial}, style={circle|rounded|square}, size={xs_24|sm_32|md_40|lg_48|xl_64|2xl_80}`\n\n#### style=circle\n| type \\\\ size | xs_24 | sm_32 | md_40 | lg_48 | xl_64 | 2xl_80 |\n|---|---|---|---|---|---|---|\n| default | `1871:76027` | `1871:75667` | `1871:75307` | `1871:72652` | `1871:72440` | `1866:71483` |\n| image | `1871:76038` | `1871:75678` | `1871:75318` | `1871:72663` | `1871:72451` | `1866:71482` |\n| initial | `1871:76049` | `1871:75689` | `1871:75329` | `1871:72674` | `1871:72462` | `1866:71481` |\n\n#### style=rounded\n| type \\\\ size | xs_24 | sm_32 | md_40 | lg_48 | xl_64 | 2xl_80 |\n|---|---|---|---|---|---|---|\n| default | `1871:76060` | `1871:75700` | `1871:75340` | `1871:72685` | `1871:72473` | `1866:71479` |\n| image | `1871:76071` | `1871:75711` | `1871:75351` | `1871:72696` | `1871:72484` | `1866:71478` |\n| initial | `1871:76082` | `1871:75722` | `1871:75362` | `1871:72707` | `1871:72495` | `1866:71477` |\n\n#### style=square\n| type \\\\ size | xs_24 | sm_32 | md_40 | lg_48 | xl_64 | 2xl_80 |\n|---|---|---|---|---|---|---|\n| default | `1871:76093` | `1871:75733` | `1871:75373` | `1871:72718` | `1871:72506` | `1866:71476` |\n| image | `1871:76104` | `1871:75744` | `1871:75384` | `1871:72729` | `1871:72517` | `1866:71475` |\n| initial | `1871:76115` | `1871:75755` | `1871:75395` | `1871:72641` | `1871:72528` | `1866:71480` |\n\n## Type 가이드 (verbatim)\n\n> \"아바타 유형은 사용 사례 및 어플리케이션에 따라 다양합니다. 일반적으로 아바타는 사람을 나타내는 유형과 개체를 나타내는 유형 두 가지 범주 중 하나에 속합니다. 이러한 범주 내에서 아이콘이나 이니셜과 같은 대체 변형을 사용할 수 있습니다.\"\n\n| type | 설명 |\n|---|---|\n| `default` | 기본 사람 아이콘 (placeholder · 정보 없을 때) |\n| `image` | 사용자 사진 (가장 흔한 패턴) |\n| `initial` | 이름 이니셜 텍스트 (이미지 없을 때 fallback) |\n\n## Style\n\n| style | 설명 | radius |\n|---|---|---|\n| `circle` | 원형 (사람용 기본) | 999 |\n| `rounded` | 둥근 사각 (브랜드/단체용) | 12 |\n| `square` | 사각 (objects/엔티티용) | 0 |\n\n## Size\n\n| size | 영역 | 사용 컨텍스트 |\n|---|---|---|\n| xs_24 | 24×24 | inline list, dense table |\n| sm_32 | 32×32 | comment row, compact card |\n| md_40 | 40×40 | header user menu, default |\n| lg_48 | 48×48 | profile section, modal title |\n| xl_64 | 64×64 | profile preview, dialog |\n| 2xl_80 | 80×80 | profile page hero, settings |\n\n## 인스턴스 prop ↔ Style 9 variants 매핑\n\n> **출처 명시**: 아래 boolean prop들은 가이드 페이지 별도 섹션이 아니라 `1:69377` \"스타일(Style)\" 행 9 variants에 통합 노출됨. 즉 Figma 가이드는 enum형 Style prop 1개로 보여주고, 실제 컴포넌트 인스턴스에서는 boolean toggle 조합으로 구현.\n\n| Style variant (Figma 가이드) | 대응 instance prop | 설명 |\n|---|---|---|\n| Default | (없음) | 기본 컨테이너만 |\n| Border | `border = true` | 외곽 ring (가시 회색 outline) |\n| Circle / Round / Square | `style = circle/rounded/square` | 모서리 형태 (3 단계 enum, 보조 axis) |\n| None | (없음) | 부가 요소 없음 (xs/sm은 이 옵션만 사용 가능) |\n| Number | `badge = true` | 우상단 카운트 뱃지 (`badges_v0.21_atom`) |\n| Icon Button | `iconButton = true` | 우하단 원형 quick action (전화/메시지 등) |\n| Dot | `indicator = true` | 우하단 status dot (~25% size, 흰색 2px ring) |\n\n추가 boolean prop:\n- **activeRing**: 외곽 brand orange ring (활성 사용자 강조). Style 9에는 없으나 인스턴스 prop으로 존재.\n\n> indicator/badge/iconButton는 avatar 외곽 코너에 배치되며 컨테이너 overflow를 벗어남 → 시각화 시 부모 wrapper에 `overflow: visible` 필수 (`.avatar` 자체는 image 클리핑 위해 `overflow: hidden` 유지).\n\n## 기본 아이콘 유형 (Default type)\n\n> `1:69582` 사용 예시 페이지에서 확인된 verbatim 패턴.\n\n`type=default` (이미지 없음, 이니셜 없음) 아바타는 **회색 배경(`common/avatar-bg-default` = `#c6c6c6`) + 흰색 사람 실루엣 아이콘** 으로 일관 표시. 모든 default 인스턴스(group/array/use case)에서 동일 아이콘 사용 — 별도 모드/사이즈 분기 없음.\n\n```\n[bg #c6c6c6]\n  └─ <svg fill=#fff>\n       <circle cx=12 cy=9 r=4>      ← 머리\n       <path d=\"M4 22c0-4.4 3.6-8 8-8s8 3.6 8 8\"> ← 몸통\n     </svg>\n```\n\n이니셜 폴백(initials)이나 photo 가 우선이고, 둘 다 없을 때만 default 아이콘 노출.\n\n## Group — `avatar_group`\n\nset ID: `1871:77789`. Property 1 단일 prop:\n\n| value | variant ID | 설명 |\n|---|---|---|\n| `1 single` | `1871:77788` | 단일 아바타 |\n| `2 group` | `1871:77787` | 2명 (1명 표시 + +1 카운트 또는 2명 stack) |\n| `3 group` | `1871:77785` | 3명 |\n| `4 group` | `1871:77786` | 4명 (4명 이상은 마지막에 +N) |\n\n> 그룹 슬롯 50×50 고정. 컨테이너에서 70px 간격으로 배치 (50 + 20 gap).\n\n## Array Layout — `avatar array`\n\nset ID: `4270:111923`. type × size = 12 variants:\n\n| type \\\\ size | xs_24 | sm_32 | md_40 | lg_48 | xl_64 | 2xl_80 |\n|---|---|---|---|---|---|---|\n| spread | `4270:112153` | `4270:112150` | `4270:112141` | `4270:112135` | `4270:112132` | `4270:111895` |\n| stack | `4270:112156` | `4270:112147` | `4270:112144` | `4270:112138` | `4270:112129` | `4270:111924` |\n\n### Spread (분리 배치) 간격\n\n| size | 항목 width | 항목 spacing | gap |\n|---|---|---|---|\n| xs_24 | 24 | 26 | +2 |\n| sm_32 | 32 | 36 | +4 |\n| md_40 | 40 | 46 | +6 |\n| lg_48 | 48 | 56 | +8 |\n| xl_64 | 64 | 74 | +10 |\n| 2xl_80 | 80 | 92 | +12 |\n\n### Stack (겹침 배치) 간격\n\n| size | 항목 width | 항목 spacing | overlap |\n|---|---|---|---|\n| xs_24 | 24 | 22 | −2 |\n| sm_32 | 32 | 28 | −4 |\n| md_40 | 40 | 34 | −6 |\n| lg_48 | 48 | 40 | −8 |\n| xl_64 | 64 | 54 | −10 |\n| 2xl_80 | 80 | 68 | −12 |\n\n> **공식**: spread gap = stack overlap (절댓값 동일, 부호만 다름). size별 단계는 +2 / +4 / +6 / +8 / +10 / +12.\n\n## 가이드 페이지 섹션 구조 (`1:69280`)\n\n1. **아바타 (Avatar)** — H1 타이틀 + 설명 (1800×254)\n2. **구조 Anatomy** — H2 (Number 라벨링 1~6 도식)\n3. **유형 Type** — H2 + 4개 유형 설명 카드 (888×338 grid)\n4. **규격 Size & Style** (`1:69377`) — H1 sub-page\n   - **사이즈 (Size)** 행: XS_24 / sm_32 / md_40 / lg_48 / xl_64 / 2xl_80 (6 단계)\n   - **스타일 (Style)** 행: Default / Border / Circle / Round / Square / None / Number / Icon Button / Dot (9 시각 표현)\n     - Default / Border: container 외곽선 유무 (`border` boolean)\n     - Circle / Round / Square: 모서리 형태 (`style` prop, 3 단계)\n     - None / Number / Icon Button / Dot: 부가 요소 (boolean modifier 또는 badge slot)\n   - **주의**: xs/sm 사이즈는 `None` 뱃지 옵션만 선택 가능 (소형 아바타에 뱃지 부착 시 가독성 저하)\n5. **사용 예시 Use case** (`1:69454`) — H1 sub-page\n   - **그룹 아바타**: Single / 2 group / 3 groups / 4 groups — 4 단계 (stack 레이아웃, 흰색 외곽선으로 시각 분리)\n   - **아바타 적층 방식**: Spread vs Stack 비교 (5 아바타 나열)\n6. **접근성** — H2 + 3개 H4 sub-section\n7. **사용가이드** — Do / Don't 박스 2세트 (각 880×656)\n\n## Usage Notes\n\n- DS color 토큰 미바인딩 (background `common/avatar-bg-default`만 단일 색) → **인스턴스 사용 필수**\n- variant prop 매칭은 **풀네임** 사용: `xs_24`, `sm_32`, `md_40`, `lg_48`, `xl_64`, `2xl_80` (`xs` 단독 매칭 실패)\n- group/array 사용 시 size별 **고정 spacing 패턴** 준수 (overlap = +/− (2/4/6/8/10/12))\n- `avatar_atom`을 직접 그리지 말고 `importComponentSetByKeyAsync(key)` + `createInstance()` 후 `setProperties({type, style, size})`로 호출\n- activeRing/border/indicator/badge는 boolean prop — `setProperties({\"activeRing\": true})` 등으로 토글\n- 8명 이상 그룹은 `4 group` + 별도 \"+N\" 라벨 (avatar_group은 4까지만 정의됨)\n- 접근성: 사용자 사진은 `alt`로 사용자 이름, 이니셜은 `aria-label=\"홍길동\"` 필수\n- Do: 인물 사진은 얼굴이 중앙에 — Don't: 그룹 4명 초과 노출, 임의 가공 이미지\n", "components/badge.md": "# Badge\n\n> 출처:\n> - **공통 컴포넌트(Copy)** file `lIIen1jmIhT0vuyXCMQDQA` / section `671:30059` `badge_v0.22` (production component)\n> - atom set: `671:29566` `badges_v0.22_atom` (~70 variants)\n> - **UI-Kit-Guide** file `ky00DVb1Q3RmiMlYWwdSGG` / page `1:83679` (가이드 페이지 — 세션 만료로 일부 미회수)\n> - `figma-export.json` (2026-05-04 export)\n>\n> JS 토큰: `tokens/color/component.js#badge`, `tokens/number/component.js#badge`.\n> 토큰 prefix: `badge/*`.\n\n## Overview\n- 아이콘/카운트/상태 표시용 작은 라벨 (요소 우상단 overlay 또는 inline)\n- 모드: **light** (production 노드 기준; figma-export.json에 dark도 일부 정의)\n- 컴포넌트 셋: `badges_v0.22_atom` (key `3664bb6eb310be08681f5876b31f582729a096d9`)\n\n## Number tokens (Mode 1)\n\n| size | container | dot | icon | text | border |\n|---|---|---|---|---|---|\n| xs | 14 | 4 | 10 | 10 | 1 |\n| sm | 18 | 6 | 10 | 12 | 1.35 |\n| md | 24 | 8 | 14 | 16 | 1.8 |\n| lg | 32 | 10 | 20 | 18 | 2.4 |\n| xl | 40 | 12 | 24 | 24 | 3 |\n\n> `number long`/`text` 폭은 컨테이너보다 길게 표시: xl=85·78 / lg=65.2·60.2 / md=55.4·50.4 / sm=41.8·37.8 / xs=36.8·33.8\n\n## Color tokens (production variable_defs 기준)\n\n| token | light | 비고 |\n|---|---|---|\n| `badge/border` | `#ffffff` | 외곽 ring (border boolean=true 시) |\n| `badge/neutral-bg` | `#1d1d1d` | color=neutral 배경 (dark gray) |\n| `badge/accent-bg` | `#f03823` | color=accent 배경 (red — alert) |\n| `badge/icon-invert` | `#ffffff` | 아이콘/텍스트 fg (흰색) |\n\n### figma-export.json 추가 토큰 (검증 미완)\n| token | light | dark |\n|---|---|---|\n| `badge/icon-default` | `#dddddd` | `#bcbcbc` |\n| `badge/icon-invert` | `#000000` | `#f4f4f4` |\n\n> production 변수 해석값과 figma-export.json 사이 일부 차이 존재 (mode 바인딩 변경 가능성). 신뢰 우선순위: production variable_defs.\n\n## Variants — 4축\n\nverbatim prop 이름:\n- **type**: `number` / `number long` / `new` / `icon` / `text` / `dot-new` (6가지 — `dot` 아님!)\n- **size**: `xs` / `sm` / `md` / `lg` / `xl` (5단계)\n- **color**: `neutral` / `accent` (2가지 — 색상명 아님!)\n- **max number (999+)**: `false` / `true` (괄호+`+` 포함 — `number long`에만 의미 있음)\n\n조합 수: number/new/icon/text/dot-new × size × color × 1 = 50 + number long × size × color × 2 = 20 = **70 variants**\n\n## Variant IDs (size × type × color)\n\n### color=neutral\n| size \\\\ type | number | number long | new | icon | text | dot-new |\n|---|---|---|---|---|---|---|\n| xs | `3830:5975` | `3830:5984` | `3830:5978` | `3830:5981` | `3830:5987` | `3830:6008` |\n| sm | `671:29631` | `671:29691` | `671:29643` | `671:29663` | `671:29703` | `3755:33203` |\n| md | `671:29627` | `671:29687` | `671:29639` | `671:29651` | `671:29699` | `3755:33202` |\n| lg | `671:29629` | `671:29689` | `671:29641` | `671:29657` | `671:29701` | `3755:33201` |\n| xl | `671:29567` | `671:29587` | `671:29571` | `671:29575` | `3755:38132` | `3755:33200` |\n\n### color=accent\n| size \\\\ type | number | number long | new | icon | text | dot-new |\n|---|---|---|---|---|---|---|\n| xs | `3830:5996` | `3830:5990` | `3830:5999` | `3830:6002` | `3830:5993` | `3830:6005` |\n| sm | `671:29739` | `671:29715` | `671:29751` | `671:29771` | `671:29727` | `3755:33207` |\n| md | `671:29735` | `671:29711` | `671:29747` | `671:29759` | `671:29723` | `3755:33206` |\n| lg | `671:29737` | `671:29713` | `671:29749` | `671:29765` | `671:29725` | `3755:33205` |\n| xl | `671:29603` | `671:29595` | `671:29607` | `671:29611` | `671:29599` | `3755:33204` |\n\n> `number long` variants는 `max number (999+)=true` 기본 (다른 type은 `false`). max=false도 별도 존재 가능.\n\n## Type 별 설명\n\n| type | 용도 | 콘텐츠 |\n|---|---|---|\n| `number` | 알림 카운트 (1~99) | 정사각 cell + 숫자 텍스트 |\n| `number long` | 99 초과 카운트 (99+) | 가로 길이 확장된 cell + \"99+\" 텍스트 |\n| `new` | 신규 표시 | \"N\" 또는 \"NEW\" 텍스트 |\n| `icon` | 아이콘 표시 (체크/경고/잠금 등) | 아이콘 단일 |\n| `text` | 짧은 라벨 (HOT, BETA 등) | 텍스트 단일 |\n| `dot-new` | 점 + 신규 (visual indicator) | 작은 dot + new 결합형 |\n\n## Color 별 의미\n\n| color | bg | 의미 |\n|---|---|---|\n| `neutral` | `#1d1d1d` (dark gray) | 일반 알림/카운트 |\n| `accent` | `#f03823` (red) | 경고/긴급/오류 |\n\n## Position (가이드 페이지 `1:83931` verbatim)\n\n> 배지는 1의 자리와 10의 자리, 100의 자리, 최대 자리수에 따라 배지의 위치가 달라집니다.\n> 버튼과 텍스트의 경우 요소의 우측 상단에 고정되며 왼쪽으로 자리수가 늘어나게 됩니다.\n> 아이콘일 경우 중앙을 기준으로 자리수가 늘어나게 됩니다.\n>\n> \\*예외적으로 아이콘이나 컨텐츠에 따라 별도의 위치가 지정될 수 있습니다.\n\n### 핵심 규칙\n\n| 호스트 타입 | 기준점 | 자리수 증가 시 확장 방향 |\n|---|---|---|\n| 버튼 / 텍스트 | 요소의 **우측 상단** 고정 | 왼쪽으로 늘어남 |\n| 아이콘 | **중앙** 기준 (가운데 위쪽) | 양쪽(좌우)으로 늘어남 |\n\n### 시각 예시 (가이드 페이지 4 행 verbatim)\n\n1. **Button row** (4 단계 자리수 시연): `Button + 9` / `Button + 99` / `Button + 999` / `Button + 999+` — 우측 상단 고정, 왼쪽으로 확장\n2. **Tab navigation row**: `홈+99+` / `구독+99` / `이웃+9` / `인기글+dot` / `내소식+dot` / `채팅` — 탭 라벨 우측 상단\n3. **Icon row** (4 단계 자리수 시연): 말풍선+`9` / 슬라이더+`90` / 메일+`900+` / 명함+`dot` — 아이콘 중앙 기준\n4. **GNB row**: 마이크(no badge, active) / 카메라+`dot` / 홈+`N` / 폴더+`50` / 사진+`999+` — 하단 nav 아이콘별 다양한 자리수\n\n> 자리수가 늘어나면 button/text에서는 왼쪽 인접 콘텐츠를 침범할 수 있으나 아이콘에서는 좌우 대칭으로 펼쳐짐 — 두 호스트 타입의 본질적 anchor 차이.\n\n## Use case (가이드 페이지 `1:84012` verbatim)\n\n> 숫자 배지는 신규 또는 업데이트된 항목의 개수를 알수 있고 사용자가 정확한 업데이트 횟수를 파악하는 것이 중요할 때 사용됩니다. 이 배지는 최대 세 자리 숫자로 구성되며, 그 이상의 개수가 카운트 될때 마지막 자리는 더하기 기호로 표시됩니다.\n>\n> **숫자 배지는 큰 아이콘 버튼 (48px)과 함께만 사용할 수 있습니다.**\n>\n> 점 배지는 새 알림이 있지만 정확한 알림 개수가 사용자에게 알려지지 않았거나 중요하지 않은 경우에 사용됩니다. 이 점 배지는 숫자 배지보다 눈에 띄지 않지만 아이콘 버튼으로 사용자의 주의를 효과적으로 끌어당기는 역할을 합니다. 툴바의 아이콘 버튼에서 흔히 볼수 있습니다.\n>\n> 점 배지의 경우 대부분의 경우 사용자가 확인 또는 한번 클릭 이후에는 미노출상태로 변경됩니다.\n> 단발성이 아닌 신규 서비스 런칭 등 일정기간 동안 알림이 노출되어야 할때는 해당 서비스 진입 이후에도 정해진 기간 동안 지속적으로 노출 됩니다.\n\n### Number badge 규칙 정리\n\n- **용도**: 신규/업데이트된 항목 개수를 정확히 알려야 할 때\n- **최대 자리수**: 3 (그 이상은 마지막 자리를 `+`로 표시 → `999+`)\n- **호스트 제약**: **큰 아이콘 버튼(48px)과 함께만** 사용 (그 외 아이콘 사이즈에는 number badge 부착 금지)\n\n### Dot badge 규칙 정리\n\n- **용도**: 새 알림이 있지만 개수가 알려지지 않았거나 중요도가 낮을 때\n- **시각**: number보다 눈에 덜 띄지만 아이콘 버튼에서 사용자 주의 환기 역할\n- **흔한 위치**: 툴바의 아이콘 버튼\n- **소멸 규칙**:\n  - 일반 dot: 사용자가 확인 / 한번 클릭 이후 미노출로 변경\n  - 신규 서비스 런칭 등 기간성 알림: 해당 서비스 진입 이후에도 정해진 기간 지속 노출\n\n### 시각 예시 (가이드 페이지 verbatim)\n\n가이드 페이지에 등장하는 실제 사용 화면:\n\n1. **Number 4단계 + dot 시연**: 말풍선 아이콘 + (`9` / `99` / `999` / `999+`) accent + 우측에 dot 단독 1개\n2. **\"읽기 전\" vs \"읽은 후\"**: 읽기 전 행 = 좌측에 작은 빨간 dot + 텍스트 / 읽은 후 행 = dot 없음\n3. **채팅 메시지 카드**: avatar + 메시지 본문 + 우측에 number `9` (accent)\n4. **Inbox 메뉴 행**: 메일 아이콘 + \"Inbox\" + 우측에 number `9` (neutral 검정 배경)\n5. **모터 설정 행**: \"속도 / 거리 `9` ›\" — inline trailing badge + chevron\n6. **챗방 행**: avatar(SS 이니셜) + \"서울하이안치과\" + dot 부착 + 즐겨찾기 별 + 시간\n7. **메뉴 row 6 시연**: 동일 4메뉴(접수/통계/히포챗/지원)에 자리수만 다름 — `999+` / `99` / `9` / `dot` / `inline 9` / `inline only`\n\n> **금지 패턴 (가이드 verbatim 외 운영 원칙)**:\n> 1. 일반 버튼(20~40px) + number badge — 가이드 명시 위반\n> 2. dot badge가 클릭 후에도 영구 잔존 — UX 원칙 위반 (기간성 예외 제외)\n> 3. avatar `xs_24`에 badge — 가독성 부족 (avatar `sm_32` 이상 권장)\n\n## Usage Notes\n\n- variant 매칭 시 verbatim prop 이름 사용:\n  - `\"type=number long\"` (공백 포함)\n  - `\"max number (999+)=true\"` (괄호+`+` 포함 — 특수문자 escape 주의)\n  - `\"type=dot-new\"` (`dot`이 아님!)\n- avatar / icon button 우상단 overlay 패턴이 가장 흔함\n- 99 초과는 `number long` + `max number (999+)=true`로 `99+` 표시\n- `border` boolean true 시 외곽에 흰색 ring (`badge/border` `#ffffff`, size별 1~3px)\n- `accent` color는 alert/error 한정 — 일반 알림은 `neutral`\n- `dot-new`는 단순 dot 표시 + new 강조의 결합형 (`dot` 단독 type은 없음)\n- 컴포넌트 set 이름이 v0.22 (이전 메모리는 v0.21로 표기 — 현행 v0.22 사용)\n", "components/breadcrumb.md": "# Breadcrumb\n\n> 출처:\n> - **공통 컴포넌트(Copy)** file `lIIen1jmIhT0vuyXCMQDQA`:\n>   - `2254:35041` `Breadcrumb` (wrapper)\n>   - `2248:58964` `breadcrumb_item` (item — **30 variants**, 5축)\n> - **UI-Kit-Guide** file `ky00DVb1Q3RmiMlYWwdSGG`:\n>   - `1:211588` (가이드 페이지)\n>   - `100:59080` (가이드 페이지)\n>\n> JS 토큰: `tokens/color/component.js#breadcrumb`.\n> 토큰 prefix: `breadcrumb/*`.\n\n## Overview\n- 페이지 계층 경로 표시 (Home > Page > ... > Current)\n- 모드: **light** (production variable_defs 기준)\n- 2 컴포넌트:\n  - **`Breadcrumb`** (wrapper): home 아이콘 + item 슬롯 + 마지막 current item\n  - **`breadcrumb_item`**: 개별 항목 (link / overflow / link_menu)\n\n## Number tokens (Mode 1)\n\n| token | px |\n|---|---|\n| `breadcrumb/padding` | 2 |\n| `breadcrumb/gap` | 4 |\n\n## Properties — 4 독립 axis (Figma `1:211588` Properties 섹션 기준)\n\n> Figma 가이드는 Size / Layout / Variant / State를 **각각 독립된 axis로 분리**해서 문서화. 매트릭스로 합쳐 표시하지 않음 (Use case 페이지에서만 size별 state matrix 보여줌).\n\n### Property 1 — Size (axis 단독)\n\n| size | item height | font | line-height | weight (default → current) |\n|---|---|---|---|---|\n| `sm` | 18~20 | 12 | 14 | 400 → 600 |\n| `md` | 24 | 14 | 20 | 400 → 600 |\n\n### Property 2 — Layout\n\n- 한 줄 유지 (wrap 금지)\n- 너비 부족 시 `overflow` (...) 로 중간 항목 압축\n- 항목 width는 텍스트 길이에 따라 가변 (sm 기준 link ~56 / overflow ~38 / link_menu ~80, md 기준 link ~60 / overflow ~39 / link_menu ~84)\n\n### Property 3 — Variant (`1:211767` verbatim, axis 단독)\n\n> 브레드크럼은 link, overflow, link-menu, link-menu(expanded) 총 4가지 Variant로 구성됩니다.\n\n레이아웃 (가이드 페이지 verbatim): 회색 카드 안에 3-컬럼 grid — 좌측 \"Variant\" gray label + orange chip + 우측 시각 예시. 4 행 모두 컬럼 X 좌표 일정.\n\n| variant | 표시 |\n|---|---|\n| `link` | Page › (gray text) |\n| `overflow` | … › (gray text) |\n| `link-menu` | Page ▼ › (chevron-down 표시, gray text) |\n| `link-menu(expanded)` | **Page** ▲ › + dropdown 메뉴 펼침 (text 색 **orange `#eb6100`**) — 메뉴: item 1 / **item 2** (selected, orange) / item 3 / item 4 |\n\n> 핵심: `link-menu(expanded)`의 \"Page\" 텍스트는 default state라도 **brand orange로 강조** (펼침 활성 표시).\n\n### Property 4 — State (`1:211804` verbatim, axis 단독)\n\n> 버튼은 default, hover, focused, current 상태를 가집니다.\n\n레이아웃 (가이드 페이지 verbatim): Variant × State 4×4 grid (단일 size, 일반적으로 md). 헤더 행 = \"State\" + orange chip (default/hover/focused/current), 좌측 행 라벨 = \"Variant\" + orange chip (link/overflow/link-menu/link-menu(expanded)).\n\n| variant \\\\ state | default | hover | focused | current |\n|---|---|---|---|---|\n| `link` | Page › (gray) | Page › (black + underline) | Page › (black + ring) | Page (black SemiBold) |\n| `overflow` | … › | … › | … › (focus ring) | … |\n| `link-menu` | Page ▼ › | Page ▼ › underline | Page ▼ › ring | Page ▼ (no separator) |\n| `link-menu(expanded)` | **Page** ▲ › + 펼친 메뉴 (orange) | **Page** ▲ › underline + 메뉴 | **Page** ▲ › ring + 메뉴 | **(빈 셀 — current × expanded는 정의되지 않음)** |\n\n> **핵심 규칙**:\n> - `link-menu(expanded)` 행의 \"Page\" 텍스트는 모든 state에서 **orange** 유지\n> - `current × link-menu(expanded)` 셀은 **빈 셀** (`current`는 펼침 상태가 의미 없음 — `expanded=false`일 때만 정의)\n\nState × Variant 4×4 매트릭스는 가이드 `1:211804`에 단일 size로 1회만 등장. (sm/md 각각의 state 매트릭스는 Properties가 아닌 Use case 페이지 `100:59097`에 별도 시연.)\n\n## Color tokens — production (light)\n\n### text\n| token | light |\n|---|---|\n| `breadcrumb/text-default` | `#565656` (default link gray) |\n| `breadcrumb/text-current` | `#000000` (current 페이지 — 검정 강조) |\n| `breadcrumb/text-hover` | `#000000` |\n| `breadcrumb/text-focused` | `#000000` |\n| `breadcrumb/text-selected` | `#eb6100` (link_menu의 selected 메뉴 항목 — orange) |\n| `breadcrumb/text-selected_hover` | `#bc4e00` (orange darker) |\n| `breadcrumb/text-selected_focused` | `#bc4e00` |\n\n### border\n| token | light |\n|---|---|\n| `breadcrumb/border` | `#000000` (focused ring) |\n| `breadcrumb/border_selected_hover` | `#bc4e00` |\n\n> **중요 정정**: 이전 문서는 dark 모드 값으로 표기됨. production light 기준으로 갱신.\n\n## Wrapper — `Breadcrumb`\n\n### prop\n- **size**: `md` / `sm`\n- **showHomeIcon**: boolean (default: true)\n- **children**: 슬롯 (여러 breadcrumb_item)\n\n### Variant IDs (wrapper)\n| size | ID |\n|---|---|\n| sm | `2254:40757` |\n| md | `2254:32877` |\n\n### 구조\n```\n[home_icon] [item slot ...] [current item]\n       ↑ showHomeIcon=true\n```\n\n- home 아이콘 = `system/general/fill/home` (20×20)\n- 마지막 current item은 `state=current, show divider=false` 자동 적용 (chevron 없음)\n\n## Item — `breadcrumb_item` (5축, 30 variants)\n\n### prop verbatim\n- **size**: `sm` / `md`\n- **type**: `link` / `overflow` / `link_menu`\n- **state**: `default` / `hover` / `focused` / `current`\n- **expanded**: `false` / `true` (`link_menu` 전용 — 드롭다운 펼침 표시)\n- **show divider**: `true` / `false` (`current`는 항상 false, separator 없음)\n\n### type 의미\n| type | 용도 | 시각 |\n|---|---|---|\n| `link` | 일반 페이지 링크 | \"Page name\" + chevron(▶) |\n| `overflow` | 생략 표시 (계층 너무 많을 때) | \"...\" + chevron(▶) |\n| `link_menu` | 드롭다운 메뉴 가진 링크 | \"Page\" + ▼ chevron, expanded=true 시 메뉴 표시 |\n\n### Variant IDs — `size=sm`\n\n| type \\\\ state | default (show divider=true) | hover (show divider=true) | focused (show divider=true) | current (show divider=false) |\n|---|---|---|---|---|\n| link | `2248:58722` | `2254:13937` | `2254:15107` | `2254:33777` |\n| overflow | `2254:8940` | `2254:13975` | `2254:15145` | `2254:33793` |\n| link_menu (expanded=false) | `2250:61167` | `2254:14013` | `2254:15183` | `2254:33825` |\n| link_menu (expanded=true) | `2248:58965` | `2254:13994` | `2254:15164` | — |\n\n### Variant IDs — `size=md`\n\n| type \\\\ state | default (show divider=true) | hover (show divider=true) | focused (show divider=true) | current (show divider=false) |\n|---|---|---|---|---|\n| link | `4682:76926` | `2254:38828` | `2254:38895` | `2254:38732` |\n| overflow | `2254:38748` | `2254:38847` | `2254:38911` | `2254:38796` |\n| link_menu (expanded=false) | `2254:38780` | `2254:38879` | `2254:38943` | `2254:38812` |\n| link_menu (expanded=true) | `2254:38764` | `2254:38863` | `2254:38927` | — |\n\n> 합계: sm 15개 + md 15개 = **30 variants** (link_menu의 current는 expanded=false만 정의됨)\n\n## Typography\n\n| size | textStyle (default) | textStyle (current) |\n|---|---|---|\n| sm | `body/xxs` (Pretendard 400 / 12 / lh 14) | `body/xxs (SB)` (600 / 12 / 14) |\n| md | `body/sm` (400 / 14 / lh 20) | `body/sm (SB)` (600 / 14 / 20) |\n\n### text 색상 매핑 (state별)\n| state | text 색 (token) |\n|---|---|\n| default | `text-default` `#565656` |\n| hover | `text-hover` `#000000` |\n| focused | `text-focused` `#000000` |\n| current | `text-current` `#000000` (SemiBold) |\n\n### link_menu 메뉴 항목 색상\n- 메뉴 hover/focused: `text-selected_hover` / `text-selected_focused` (`#bc4e00`)\n- 메뉴 selected: `text-selected` (`#eb6100`)\n\n## Anatomy\n\n### sm (default 크기)\n```\n🏠 ▸ Page ▸ Page ▸ Page ▸ Current\n↑    ↑    ↑    ↑    ↑    ↑\nhome gap=4 padding=2 chevron 20×20  bold black\n```\n\n### md\n```\n🏠 ▸ Page Name ▸ Page Name ▸ Current\n```\n\n### link_menu (expanded=true) 시\n```\n🏠 ▸ Page ▸ Page ▼   ← chevron-down (펼침 표시)\n                ┌──────────────┐\n                │ Sub page 1   │\n                │ Sub page 2 (selected)  ← orange\n                │ Sub page 3   │\n                └──────────────┘\n```\n\n## Separator (chevron)\n\n- 기본: `system/arrow/fill/right` (20×20, fill=false)\n- show divider=true 시 표시\n- show divider=false 시 미표시 (current item에 적용)\n- `showSlash` prop: `/` 문자 separator 옵션 (드물게 사용)\n\n## link_menu chevron 아이콘 (`1:211783` verbatim)\n\n`link-menu` / `link-menu(expanded)` variant의 chevron-down/up 아이콘은 **plain chevron이 아니라 원형 outline 안에 chevron이 들어간 형태**.\n\n```\nPage (˅) ›    ← collapsed: circle + chevron-down inside\nPage (˄) ›    ← expanded:  circle + chevron-up inside\n```\n\n- circle outline: 1px stroke, currentColor 사용 (기본 gray, hover/focused 시 black, default+expanded 시 orange)\n- circle 크기: sm 14×14, md 16×16\n- chevron 크기: sm ~8×8, md ~10×10 (원 안쪽 ~60%)\n- chevron stroke: stroke-width 2, line-cap/join round (fill 아님)\n\n## Dropdown menu (`1:211788` verbatim)\n\n`link-menu(expanded)`일 때 Page 아래에 나타나는 드롭다운 메뉴:\n\n- **컨테이너**:\n  - bg: `#ffffff`\n  - border: 1px gray (`#e9e9e9`)\n  - corner radius: 6px\n  - padding: 6px (메뉴 항목 외각 여백)\n  - shadow: `0 2px 8px rgba(0,0,0,0.08)` (subtle drop shadow)\n  - min-width: ~120px\n- **메뉴 항목 공통**:\n  - padding: 6px 10px\n  - corner radius: 4px\n  - font-size: 13px\n- **default 항목** (item 1, item 3, item 4): gray text `#1d1d1d` (또는 `#565656`), bg transparent\n- **hover 항목**: bg `#f4f4f4` 추가\n- **selected 항목** (item 2):\n  - text: orange `#eb6100`\n  - border: 1px orange `#eb6100`\n  - **background: peach `#fef7f2`** (연한 오렌지 fill — 흰 배경이 아님)\n  - corner radius: 4px (컨테이너와 동일)\n- **selected hover**: text/border `#bc4e00` (darker orange), bg `#fef7f2` 유지\n- 메뉴 위치: Page 아래로 4px gap\n\n## Guidelines Do/Don't 카드 디자인 (`1:207493` verbatim)\n\n가이드라인의 Do/Don't 카드 시각 스타일:\n\n| 요소 | Do 카드 | Don't 카드 |\n|---|---|---|\n| 배경 | `#ffffff` (흰색) | `#fef0ee` (연한 핑크) |\n| 외곽선 | `1px solid #e9e9e9` | `1px solid #fbd1cb` |\n| 헤더 underline | `2px solid #00b85e` (녹색) | `2px solid #f03823` (빨강) |\n| 헤더 텍스트 색 | `#00803e` | `#f03823` |\n| 아이콘 (원형 + symbol) | bg `#00b85e` + ✓ 흰색 | bg `#f03823` + × 흰색 |\n| 패딩 / 모서리 | padding 20px, radius 8px | 동일 |\n\n핵심: 카드 전체에 톤 배경을 깔지 않고, **헤더 영역(아이콘 + Do/Don't 텍스트) 아래에 underline**으로 분리. Don't 카드만 연한 핑크 배경.\n\n## Guidelines (`1:211894` verbatim)\n\n### 사용 시 유의사항\n\n#### Breadcrumbs와 Back Button\n사이트 계층이나 구조가 단순한 경우에는 Breadcrumbs보다 Back Button 사용을 권장합니다. 일반적으로 Back Button이 제공되는 화면에서는 Breadcrumbs를 함께 사용하지 않는 것이 좋습니다.\n\n#### Breadcrumbs는 Global Navigation을 대체하지 않음\nBreadcrumbs는 사용자의 현재 위치를 보조적으로 안내하는 탐색 요소이며, Global Navigation Bar를 대체할 수 없습니다. 주요 화면 이동은 기존 Navigation Menu를 통해 제공되어야 합니다.\n\n#### 다단계 프로세스에는 Steps 사용\nBreadcrumbs는 페이지 계층을 보여주는 탐색 컴포넌트이므로, 사용자가 순차적인 단계에 따라 진행해야 하는 프로세스에는 적합하지 않습니다. 회원가입, 설정, 신청 절차와 같이 단계 기반 흐름이 필요한 경우에는 Steps 컴포넌트를 사용합니다.\n\n### 시작 경로\n\n브레드크럼의 첫 번째 항목은 메인 화면으로 연결되는 링크로 구성합니다. 사용자가 현재 위치와 관계없이 언제든 사이트의 시작 지점으로 빠르게 이동할 수 있도록 지원합니다.\n\n| | 예시 |\n|---|---|\n| ✓ Do | 🏠 Home › Depth1 › **Depth2** |\n| ✗ Don't | Depth3 › Depth4 › **Depth5** (Home 시작점 누락) |\n\n### 단일 행 유지\n\n브레드크럼은 탐색 경로의 계층 구조를 한눈에 이해할 수 있도록 한 줄(단일 행)로 제공한다. 여러 줄로 줄바꿈되면 경로의 순서와 관계를 인지하기 어려워진다. 경로가 5개 이상인 경우에는 메인 화면 링크 다음 단계의 경로를 말줄임표(...)로 축약하여 전체 브레드크럼이 한 줄 안에 유지되도록 한다.\n\n| | 예시 |\n|---|---|\n| ✓ Do | 🏠 Home › ... › **Depth5** (overflow로 압축, 한 줄) |\n| ✗ Don't | 🏠 Home › Depth1 › Depth2 ›<br>Depth3 › Depth4 › **Depth5** (두 줄 wrap) |\n\n### Hover 시각적 피드백 제공\n\n브레드크럼 링크는 기본 상태에서 밑줄을 사용하지 않더라도, 사용자가 클릭 가능한 요소임을 인지할 수 있도록 Hover 상태를 제공한다. 마우스를 올렸을 때 밑줄 표시를 통한 시각적 피드백을 적용하여 링크로 동작함을 명확하게 전달해야 한다. Hover 효과는 일관된 방식으로 적용하여 예측 가능한 상호작용 경험을 제공한다.\n\n| | 예시 |\n|---|---|\n| ✓ Do | 🏠 Home › <u>Depth1</u> 🖱 › **Depth2** (hover 시 밑줄 표시) |\n| ✗ Don't | 🏠 Home › Depth1 🖱 › **Depth2** (hover 시 밑줄 없음 — 시각적 피드백 누락) |\n\n## 접근성 (`1:212003` verbatim)\n\n모든 사용자가 현재 위치를 인지하고 상위 경로로 이동할 수 있도록, 브레드크럼은 WCAG 및 ARIA 가이드라인을 준수해야 합니다. 키보드, 스크린리더, 터치 등 다양한 입력 환경에서 동일한 탐색 경험을 제공하여 사용 오류를 최소화합니다.\n\n### WCAG 2.2\n\n#### 구조 및 랜드마크 (SC 1.3.1)\n브레드크럼은 nav 영역으로 제공하고, `aria-label=\"Breadcrumb\"` 또는 이에 준하는 이름을 지정해야 합니다.\n\n#### 현재 위치 표시 (SC 4.1.2)\n마지막 항목은 현재 페이지를 의미하며, `aria-current=\"page\"` 속성을 사용해 명확히 전달해야 합니다.\n\n#### 키보드 접근성 (SC 2.1.1)\n모든 이동 가능한 항목은 Tab / Shift + Tab으로 초점 이동이 가능해야 하며, Enter 키로 이동할 수 있어야 합니다.\n\n## 상호작용 가이드라인 (`1:212046` verbatim)\n\n### 탐색\n\n| 구분 | 설명 |\n|---|---|\n| Tab, Shift + Tab | 이전/다음 브레드크럼 링크로 이동할 수 있어야 한다. |\n\n### 실행\n\n| 구분 | 설명 |\n|---|---|\n| Click | 선택한 단계의 페이지로 이동합니다. |\n| Enter | 포커스된 링크 페이지로 이동합니다. |\n| Space | 링크 요소에는 사용하지 않으며, 버튼형 브레드크럼일 경우에만 사용합니다. |\n\n## Usage Notes\n\n- variant 매칭 verbatim:\n  - `size=sm` / `md`\n  - `type=link` / `overflow` / `link_menu`\n  - `state=default` / `hover` / `focused` / `current`\n  - `expanded=false` / `true` (link_menu만 의미 있음)\n  - `show divider=true` / `false` (공백 포함)\n- current state는 자동으로 `show divider=false` (chevron 없음, SemiBold 텍스트, black)\n- `link_menu` selected 메뉴 항목은 brand orange (`#eb6100`)\n- 너무 많은 단계는 `overflow` (...) 로 압축 (모바일/좁은 영역에서 권장)\n- showHomeIcon: 루트 페이지로 빠른 이동\n- light 모드 기본 텍스트는 gray `#565656`, current/hover는 black `#000000`\n- breadcrumb는 navigation 보조 — 메인 nav를 대체하지 않음\n- separator는 일반적으로 chevron(▶), 한글 환경에서도 동일\n", "components/button.md": "# Button\n\n> 출처:\n> - **공통 컴포넌트(Copy)** file `lIIen1jmIhT0vuyXCMQDQA` / node `1058:185800` (production component, variable_defs)\n> - **UI-Kit-Guide** file `ky00DVb1Q3RmiMlYWwdSGG`\n>   - node `1:272462` — Button preview page (variable_defs)\n>   - node `1:273388` — `Button use it` 가이드 페이지 (sparse metadata)\n>   - node `1:274092` — `Icon button use it` 가이드 페이지 (sparse metadata)\n> - `figma-export.json` (2026-05-04 export) — light/dark 양쪽 모드 참조용\n> - **사용자 작업 파일 `↪️ Button (TEST⚠️)`** — variant set `button` (id `7046:148536`, 972 variants, 2026-05-07 TalkToFigma MCP 추출)\n>\n> JS 토큰: `tokens/color/component.js#button`, `tokens/number/component.js#button`.\n\n## Overview\n- 토큰 prefix: `button/*`\n- 모드: **light · dark** (light 값은 production 노드 변수 해석값 기준)\n- 컴포넌트 set 이름: **`button`** (이전 가이드의 `button_beta_v0.22_test`는 베타 단계 명칭, 현재 production은 `button`)\n- 사이즈: 9단계 — xxs(20) / xs(24) / sm(28) / md(32) / lg(40) / xl(48) / 2xl(64) / 3xl(80) / 4xl(96)\n  - **Figma variant prop 값은 height 접미사 포함**: `xxs_20`, `xs_24`, `sm_28`, `md_32`, `lg_40`, `xl_48`, `2xl_64`, `3xl_80`, `4xl_96`\n\n## Variant Properties (Figma `button` verbatim)\n\n> TalkToFigma MCP로 972 variants 전체 추출 (2026-05-07).\n> 모든 prop 키는 **lowercase**.\n\n| prop | 종 | 값 |\n|---|---|---|\n| `style` | 9 | `brand-primary` · `brand-secondary` · `brand-tertiary` · `neutral-primary` · `neutral-secondary` · `neutral-tertiary` · `subtle` · `destructive-primary` · `destructive-secondary` |\n| `state` | 6 | `default` · `hover` · `pressed` · `focused` · `inactive` · `disabled-gray` |\n| `size` | 9 | `xxs_20` · `xs_24` · `sm_28` · `md_32` · `lg_40` · `xl_48` · `2xl_64` · `3xl_80` · `4xl_96` |\n| `layout` | 2 | `icon labeled` · `icon only` |\n| `type` | 1 | `hug` |\n\n**총 variants = 9 × 6 × 9 × 2 × 1 = 972** (이전 메모리의 9×6×9=486은 layout 차원 누락)\n\n> 이전 메모 정정:\n> - 7번째 style: `text` → **`subtle`** (이전 가이드 페이지에서는 `text`로 표기되었으나, production variant set은 `subtle`)\n> - `distructive-*` 오타 → **`destructive-*`** (variant prop에서 정정됨. 변수 토큰 이름은 별도 검증 필요)\n> - state `disabled` → **`disabled-gray`** (variant 값 verbatim)\n> - layout은 가이드 표기 3종(`icon labeled` / `icon only` / `text only`)이 아니라 **2종**. `text only`는 `icon labeled` + 빈 아이콘 슬롯으로 구현 추정.\n\n## Figma Variable Name Lookup (이모지 제거 후)\n\n> 사용자 file에서 variable / textStyle / component name의 ❤️/✅/💟 이모지 prefix 일괄 제거 (2026-05-08).\n> Figma library publish 완료. variable ID는 그대로 유지되어 binding/instance 영향 없음.\n> DS Runner / TalkToFigma 호출 시 아래 새 이름 사용.\n\n### Color\n9 style 슬롯 (`brand-{primary,secondary,tertiary}` · `neutral-{primary,secondary,tertiary}` · `subtle` · `destructive-{primary,secondary}`) + `disabled-gray`\n- `button/bg/{slot}` (10개)\n- `button/fg/{slot}` (10개)\n- `button/border/{slot}` (10개)\n\n### Number\n- `button/size/{xxs, xs, sm, md, lg, xl, 2xl, 3xl, 4xl}` → 20 / 24 / 28 / 32 / 40 / 48 / 64 / 80 / 96\n- `button/h-padding/{xxs..4xl}` → 4 / 6 / (sm 미정의) / 8 / 12 / 12 / 16 / 24 / 24\n- `button/text-padding/{xxs, xs, md, lg, 2xl, 3xl, 4xl}` → 4 / 4 / 4 / 4 / 8 / 8 / 8 (sm 미정의)\n- `button/conrner radius/{xxs, xs, sm, md, lg, xl, 2xl, 3xl, 4xl}` → 4 / 4 / 4 / 6 / 6 / 8 / 8 / 12 / 14\n  - ⚠️ Figma 변수명에 **오타: `conrner`** (corner 아님). variant 매칭 시 verbatim 사용 필수.\n  - 별도 변형: `button/conrner radius/2xl 2` = 10 (2xl의 둥글기 약화)\n- `button/border/{xxs..4xl}` → 1 / 1 / 1 / 1 / 1 / 1.5 / 2 / 2.5 / 3\n\n### Typography (textStyle)\n- `v0.4/button/{xxs..4xl} (SB)` — SemiBold 600, 9 size\n- `v0.4/button/{xxs..4xl}` — SB 접미사 없는 변형 (variable 참조 기반, 폰트 정의 동일)\n- `tokens/typography/text-style.js#button` 에 verbatim 등록됨 (font family / weight / size / lineHeight)\n\n### Common (overlay · focus)\n- `button/common/default` = `#00000000` (transparent)\n- `button/common/hover` = `#0000000d` (black 5%, light base용)\n- `button/common/p | (미정의) |\n| `border/subtle` | `#373d4c00` (transparent) | `rgba(55,61,76,0)` |\n| `border/disabled` | `#dadada` | (미정의) |\n| `border/disabled-gray` | `#a5a5a5` | `#f4f4f4` |\n| `border/disabled-inactive` | `#8f8f8f` | `#8f8f8f` |\n\n### icon (figma-export.json 기준)\n| token | light | dark |\n|---|---|---|\n| `icon/neutral` | `#bcbcbc` | `#8f8f8f` |\n| `icon/dark` | `#0e0e0e` | `#f4f4f4` |\n| `icon/invert` | `#0e0e0e` | `#e9e9e9` |\n| `icon/disabled-inactive` | `#a5a5a5` | `#bcbcbc` |\n| `icon/disabled-gray` | `#393939` | `#bcbcbc` |\n\n### common (state overlay · focus ring)\n| token | light | dark |\n|---|---|---|\n| `common/default` | `#00000000` (transparent) | `rgba(0,0,0,0)` |\n| `common/hover` | `#0000000d` (~5% black) | `rgba(0,0,0,0.05)` |\n| `common/pressed` | `#0000001a` (~10% black) | `rgba(0,0,0,0.15)` |\n| `common/hover-neutral` | `#ffffff0d` (~5% white) | `rgba(59,99,251,0.1)` |\n| `common/pressed-neutral` | `#ffffff1a` (~10% white) | `rgba(59,99,251,0.2)` |\n| `common/selected` | `rgba(59,99,251,0.2)` | `rgba(59,99,251,0.2)` |\n| `common/focus-ring` | `#000000` | (미정의) |\n| `common/focus-ring 2` | `#fefefe` (또는 `#020202`) | `#f9f9f9` |\n\n### State overlay 분기 (어두운 base vs 밝은 base)\n\nbase 명도에 따라 overlay 색·강도가 다르다 (Figma `134:20061` 검증):\n\n| base 톤 | hover overlay | pressed overlay | 예 |\n|---|---|---|---|\n| 어두운/유채색 (brand-primary, neutral-primary, distructive-primary) | **white 15%** | **white 25%** | brand-primary `#eb6100` 위에 0.15/0.25 white |\n| 밝은 base (brand-secondary, neutral-secondary, neutral-tertiary, brand-tertiary) | black 5% (`common/hover`) | black 10% (`common/pressed`) | white bg 위에 0.05/0.10 black |\n\n이전 메모리의 \"neutral은 white, light는 black\"은 정확하지만, white의 농도를 5%/10% (`*-neutral` 토큰)로 봤던 것이 잘못 — 실제 production v0.22 brand 매트릭스는 **15%/25%** 사용.\n\n### Focus ring 구조 (`134:20102` brand-primary focused 행 verbatim)\n\n> **이전 메모리 정정**: focus는 \"외부 black + 내부 white 이중 링\"이 아니다.\n> 실제 구조 = 버튼 자체 border + 그 외부에 단일 black ring 1개 (inset 음수 절대 위치).\n> 두 링 사이의 **투명 갭**이 light 배경에서 흰색 띠처럼 보이는 것이 \"white line\"의 정체.\n\n| size | button border weight | focus ring inset | focus ring weight | focus ring radius |\n|---|---|---|---|---|\n| xxs (20) | 1 | -3 | 1 | 6 |\n| xs (24)  | 1 | -3 | 1 | 6 |\n| sm (28)  | 1 | -3 | 1 | 6 |\n| md (32)  | 1 | -3 | 1 | 8 |\n| lg (40)  | 1 | -3 | 1 | 8 |\n| xl (48)  | 1.5 | -3.5 | 1.5 | 10 |\n| 2xl (64) | 2 | -4 | 2 | 10 |\n| 3xl (80) | 2.5 | -4.5 | 2.5 | 13 |\n| 4xl (96) | 3 | -5 | 3 | 14 |\n\n- focus ring 두께 = 해당 사이즈의 button border 두께와 동일 (`button/border/{size}` 토큰 공유)\n- focus ring 반지름 = button corner radius + ~2px (4xl만 동일, 나머지는 +2)\n- focus ring 색상 = `common/focus-ring` (= `#000000`, light 모드 단일값)\n- **갭 폭 = `|inset|` − ring weight = 모든 사이즈 일정 2px** (Figma는 box-sizing: border-box처럼 ring 외각이 inset 값이므로 안쪽 시작점은 `|inset| − weight`)\n  - 예: md → inset 3 − weight 1 = 2px 갭\n  - 예: 4xl → inset 5 − weight 3 = 2px 갭\n- `common/focus-ring 2` (white) 토큰은 정의돼 있으나 현재 v0.22 브랜드 버튼 매트릭스에서는 **사용되지 않음** (legacy 또는 다크모드/inverse 케이스 예약 추정)\n\nCSS 구현 가이드:\n```css\n.btn--md.btn--focused {\n  outline: 1px solid #000;     /* common/focus-ring, weight = button/border/md */\n  outline-offset: 2px;          /* 갭 폭 (border edge → outline 시작점), 모든 사이즈 동일 */\n}\n```\n`outline-offset`은 border edge로부터 outline 시작점까지의 거리(=투명 갭 폭). outline-width는 그 시작점부터 바깥 방향으로 그려지므로, ring 외곽까지의 총 거리는 `offset + width`.\n\n## Typography\n\n| size | textStyle | font · size · line-height |\n|---|---|---|\n| xxs | `button/xxs (SB)` | Pretendard 600 / 12 / 16 |\n| xs | `button/xs (SB)` | Pretendard 600 / 14 / 20 |\n| sm | `button/sm (SB)` | Pretendard 600 / 14 / 20 |\n| md | `button/md (SB)` | Pretendard 600 / 16 / 24 |\n| lg | `button/lg (SB)` | Pretendard 600 / 16 / 24 |\n| xl | `button/xl (SB)` | Pretendard 600 / 18 / 24 |\n| 2xl | `button/2xl (SB)` | Pretendard 600 / 24 / 30 |\n| 3xl | `button/3xl (SB)` | Pretendard 600 / 28 / 36 |\n| 4xl | `button/4xl (SB)` | Pretendard 600 / 32 / 40 |\n\n> 가이드 페이지에서 추가 발견: `v0.3 (test)/button/4xl`(line-height=1, 비표준), `v0.4/button/*` 시리즈(현행).\n\n## Style 9가지 (Figma `button` verbatim)\n\n| # | style | 비고 |\n|---|---|---|\n| 1 | `brand-primary` | 브랜드 강조 (orange #eb6100) |\n| 2 | `brand-secondary` | 브랜드 보조 (white bg + orange text) |\n| 3 | `brand-tertiary` | 브랜드 약함 (light orange bg) |\n| 4 | `neutral-primary` | 기본 강조 (dark bg + white text) |\n| 5 | `neutral-secondary` | 기본 보조 (white bg + gray border) |\n| 6 | `neutral-tertiary` | 기본 약함 (light gray bg) |\n| 7 | **`subtle`** | 텍스트 전용 (transparent bg/border, gray text · `#606881`) — 이전 가이드의 `text` 명칭이 production에서 `subtle`로 변경됨 |\n| 8 | `destructive-primary` | 빨강 강조 — 이전 가이드의 `distructive-primary` 오타가 production에서 정정됨 |\n| 9 | `destructive-secondary` | 빨강 보조 (transparent bg) — 마찬가지로 정정 |\n\n> **명칭 변경 history**: 이전 베타(`button_beta_v0.22_test`)에서는 `text` / `distructive-*`였으나, production `button` set에서 `subtle` / `destructive-*`로 표준화됨. variant prop 매칭/instance override는 production 명칭 사용.\n\n## State 6단계 (Figma `button` verbatim)\n\n| # | state | 트리거 | 시각 |\n|---|---|---|---|\n| 1 | `default` | 평상시 | base 색 |\n| 2 | `hover` | 마우스 위에 | base 색 위에 white 15% (밝은 base는 black 5% — `common/hover` token) 알파 합성 |\n| 3 | `pressed` | 클릭 중 | base 색 위에 white 25% (밝은 base는 black 10% — `common/pressed` token) 알파 합성 |\n| 4 | `focused` | 키보드 focus | `common/focus-ring` (black) 외부 단일 링 + 버튼 외곽선과 ring 사이 투명 갭 (위 Focus ring 구조 표 참조) |\n| 5 | `inactive` | 1차 비활성 (브랜드 톤 유지, 약하게 보임) | **원본 스타일 색 그대로 + `opacity: 0.4`** 전체 적용 (별도 색 토큰 교체 없음) |\n| 6 | `disabled-gray` | 2차 완전 비활성 (회색 톤 교체) | bg `bg/disabled` (#dadada) · border `border/disabled` (#dadada) · text `fg/disabled` (#a5a5a5) — 토큰 풀 교체 |\n\n> **명칭 history**: 이전 가이드의 `Disabled` 단일 표기 → production은 `disabled-gray` (variant prop에 다른 disabled 분기가 없는데 `-gray` 접미사가 붙어있음. 이전의 `disabled-inactive` / `disabled-1` 같은 분기는 production에서 제거된 것으로 추정).\n> Loading state는 별도 `state=Loading` variant로 처리 (가이드 6열에는 미포함, production 6 state에도 없음).\n\n> Loading state는 별도 `state=Loading` variant로 처리 (가이드 6열에는 미포함).\n\n## Variants / Layout\n\n- **`layout`** (production verbatim, 2종):\n  - `icon labeled` — 아이콘 + 라벨 (icon-start 슬롯 + 라벨 + icon-end 슬롯). `text only`는 별도 variant 없이 이 layout에서 아이콘 슬롯을 visible: false로 처리하는 것으로 추정.\n  - `icon only` — 정사각 (라벨 없음)\n- **`type`** (1종): `hug` (기본 — 콘텐츠 크기에 맞춰 hug)\n- **selected**: `common/selected` 알파(브랜드 블루 20%)로 활성 표시 가능 (별도 prop 없음, instance override로 표현)\n\n## Icon Button (별도 가이드)\n\n> `1:274092` `Icon button use it` 페이지 — Button과 별개 매트릭스로 문서화 (variable_defs 기준).\n> 인스턴스 prop: `layout=icon only` (Button set 공유) 또는 별도 `iconButton_*` variant.\n\n- 9 style × 6 state × 9 size 매트릭스 (Button과 동일 골격)\n- **icon-only 정사각**: width = height (라벨 없음)\n\n### 사이즈 매트릭스 (1:1 정사각)\n\n| size | px | corner radius | border | icon size (권장) |\n|---|---|---|---|---|\n| xxs | 20 × 20 | 4 | 1 | 12 |\n| xs  | 24 × 24 | 4 | 1 | 14 |\n| sm  | 28 × 28 | 4 | 1 | 16 |\n| md  | 32 × 32 | 6 | 1 | 16 |\n| lg  | 40 × 40 | 6 | 1 | 20 |\n| xl  | 48 × 48 | 8 | 1.5 | 24 |\n| 2xl | 64 × 64 | 8 | 2 | 28 |\n| 3xl | 80 × 80 | 12 | 2.5 | 32 |\n| 4xl | 96 × 96 | 14 | 3 | 40 |\n\n> width/height 토큰 = `button/size/{size}` (Button height와 동일 시리즈) · radius 토큰 = `button/corner-radius/{size}` 공유 · 아이콘 사이즈는 별도 정의되어 있지 않고 디자이너 가이드 권장값.\n\n### 스타일/상태/오버레이\n\n- 9 style 토큰 (bg/border/fg) 모두 Button과 **동일** (brand-primary, brand-secondary, brand-tertiary, neutral-primary, neutral-secondary, neutral-tertiary, text, distructive-primary, distructive-secondary)\n- 6 state도 Button과 동일 (default/hover/pressed/focused/disabled-1/disabled-2)\n- overlay·focus ring·disabled 동작도 Button과 동일 (위 표 그대로 적용)\n\n### `button/common/*` 변수 verbatim (`1:274092` variable_defs)\n\n> 이 페이지에서 추출한 production 변수값 — 이전 `#0000000d` (5% black) 메모리는 별도 `*-neutral` 변형이거나 구버전. 현 v0.22 production은 white 알파 일원화.\n\n| 토큰 | hex | 알파 |\n|---|---|---|\n| `button/common/default` | `#00000000` | 0% |\n| `button/common/hover` | `#ffffff26` | white 15% (38/255) |\n| `button/common/pressed` | `#ffffff40` | white 25% (64/255) |\n| `button/common/focus-ring` | `#000000` | 100% black |\n| `button/common/focus-ring 2` | `#fefefe` | 미사용 (legacy) |\n\n### Anatomy\n\n- **container**: 정사각 box (size = corner radius 적용)\n- **icon**: 컨테이너 중앙 정렬, currentColor 사용 (fg 토큰 자동 상속)\n- **focus ring**: Button과 동일 매트릭스 (위 Focus ring 구조 표 참조)\n\n### 사용 가이드\n\n- 라벨 없이 아이콘 1개만 — 접근성을 위해 **`aria-label` 또는 tooltip 필수**\n- variant 매칭 시 Button set에서 `layout=icon only`로 호출 가능 (단일 source of truth)\n- icon-only 사용 시 사이즈가 작아 터치 타겟 가이드라인(44×44 이상) 충족 어려움 → xxs/xs/sm은 데스크탑 전용, 모바일은 lg 이상 권장\n- 의미가 명확한 경우(✕, ←, ⚙, 🔍 등)에만 사용 — 모호한 아이콘은 라벨 있는 Button 사용\n\n## Guidelines (`1:272816` verbatim)\n\n### Hierarchy\n버튼의 시각적 주목도는 배경색 대비에 따라 달라집니다. 화면에서 강조하려는 정도에 따라 적절한 Variant를 선택해서 사용해주세요.\n\n| Emphasis | Variants | 개수 | 용도 |\n|---|---|---|---|\n| High emphasis (대비가 강한 배경색) | `neutural-primary` / `brand-primary` / `distructive-primary` | 1개 | 가장 중요한 역할의 CTA에 사용 |\n| Medium emphasis (흰색 배경색) | `neutural-secondary` / `brand-secondary` | 여러 개 | 대부분의 액션에 사용 / High emphasis 버튼과 조합하여 사용 |\n| Low emphasis (대비가 약한 배경색) | `neutural-tertiary` / `brand-tertiary` | 여러 개 | 중요도가 낮은 보조 액션을 표현할 때 사용 |\n| No emphasis (배경색 없음) | `Subtle` (text) | 여러 개 | 취소 등의 버튼에 사용 |\n\n### Properties — 상황에 따라 적절한 Variant 사용하기\n화면 내 중요도에 따라 적절한 Variant를 선택해서 사용합니다.\n\n- **neutural-primary** — 대부분의 화면에서 CTA로 사용합니다. 고대비로 접근성과 가독성이 높아 사용자가 화면 정보에 집중할 수 있도록 돕습니다. 한 화면에 하나만 사용하는 것을 권장합니다.\n- **brand-primary** — 사용자 간 연결이 일어나는 서비스의 주요 기능에 사용합니다. 위계가 높고 브랜드 임팩트가 강한 액션이므로 한 화면에 하나만 사용하는 것을 권장합니다.\n- **distructive-primary** — 삭제나 초기화처럼 되돌릴 수 없는 중요한 작업에 사용합니다. 사용자에게 위험을 분명하게 알려주는 역할을 하며, 주로 Alert Dialog에서 사용됩니다.\n- **neutural-secondary** — 보조 기능이나 서브 액션에 사용합니다. primary보다 시각적 강조는 낮지만 버튼 형태는 유지되어, 화면 내 여러 기능을 안정적으로 구분해 전달할 수 있습니다. primary와 함께 사용할 때 보조 선택지로 활용하는 것을 권장합니다.\n- **brand-secondary** — 브랜드 성격을 유지하면서도 primary보다 한 단계 낮은 강조가 필요한 기능에 사용합니다. 주요 흐름을 방해하지 않으면서 서비스의 브랜드 톤을 드러낼 수 있으며, 동일 맥락의 보조 액션이나 연계 기능에 적합합니다.\n- **distructive-secondary** — 삭제, 해제, 취소 등 주의가 필요한 작업 중에서도 primary만큼 강한 경고가 필요하지 않은 경우에 사용합니다. 위험성은 전달하되 과도한 시각적 부담은 줄일 수 있어, 보조 위험 액션이나 선택적 파기 기능에 적합합니다.\n- **neutural-tertiary** — 배경의 영향 없이 가볍게 사용할 수 있는 저강도 액션에 사용합니다. 버튼의 존재감은 최소화하면서도 클릭 가능한 요소임을 전달할 수 있어, 리스트·툴바·필터 등 반복적으로 등장하는 기능에 적합합니다.\n- **brand-tertiary** — 브랜드 컬러를 활용해 가볍게 강조하고자 할 때 사용합니다. tertiary 특유의 낮은 위계를 유지하면서도 서비스의 정체성을 표현할 수 있어, 링크성 액션이나 보조 탐색 기능에 적합합니다.\n- **text** — 가장 낮은 위계의 액션에 사용합니다. 배경이나 테두리 없이 텍스트 중심으로 표현되어 화면 밀도를 높이지 않으며, 부가 기능, 링크성 동작, 보조 탐색 등 가벼운 상호작용에 적합합니다. 과도한 사용은 클릭 중요도를 낮출 수 있으므로 제한적으로 사용하는 것을 권장합니다.\n\n### Label 작성하기 (`1:273021` verbatim)\n\n버튼 라벨의 문구는 사용자가 수행할 행동을 **명확하고 예측 가능하게** 표현해야 합니다.\n\n항상 사용자 시점에서 작성하고, 동일한 액션에는 일관된 단어와 톤을 유지합니다.\n\n불필요한 단어나 모호한 표현은 피하고, 간결한 문장을 사용합니다. 사용자가 조치를 취하기 전에 대화 상자를 읽게 만드는 **모호하고 일반적인 라벨을 사용하지 마세요**.\n\n영문 표기시 버튼 레이블을 **모두 대문자 또는 대소문자를 섞어서 사용하지 마세요**.\n\n| ✓ Do | ✗ Don't |\n|---|---|\n| 전송하기 (간결한 동사) | DON'T USE UPPERCASE (전체 대문자) |\n| Use sentence case | Don't Use Title Case |\n| 시작하기 | 다음 (모호한 라벨) |\n| Dialog \"삭제하시겠습니까?\" + 삭제하기(destructive) / 취소 | Dialog \"삭제하시겠습니까?\" + 예 / 아니오 (모호한 yes/no) |\n| Dialog \"Discard this comment?\" + Cancel / Discard (액션 매칭) | Dialog \"Discard this comment?\" + Cancel / Delete (라벨/액션 불일치) |\n\n### Icon의 사용 (`1:273081` verbatim)\n\n아이콘은 버튼의 동작을 시각적으로 표현하고 강조하는 데 도움을 줍니다.\n\n아이콘은 라벨의 앞이나 뒤에 배치할 수 있으며, **Prefix는 주로 액션의 의미를 보조**하고, **Suffix는 Chevron처럼 동작을 보조하는 역할**을 합니다.\n\n| ✓ Do | ✗ Don't |\n|---|---|\n| `[✈ 전송]` (Prefix: 의미 보조) | `[🔍 환자 검색 ›]` (Prefix + Suffix 양쪽 동시) |\n| `[🔍 검색]` (Prefix) |  |\n| `[더 보기 ›]` (Suffix: chevron) |  |\n| `[필터 ▾]` (Suffix: chevron-down) |  |\n\n### Primary Button의 활용 (`1:273113` verbatim)\n\n사용자가 특정 작업을 수행하거나 흐름을 진행하거나, 확인 후 닫기 또는 작업을 완료할 수 있도록 **상황별로 프라이머리 버튼을 하나씩만** 사용하세요.\n\n화면에 여러개 프라이머리 버튼을 사용하지 마세요.\n\n프라이머리 버튼은 주요 동작을 수행해야 하며, 세컨더리 버튼은 해당 동작에 대한 대안을 제공할 수 있습니다.\n\n버튼이 콘텐츠와 함께 스크롤 되는 경우에는 primary 버튼을 맨 위에 배치합니다. 버튼들이 아래쪽에 고정되어 있다면 기본 버튼을 아래쪽에 배치합니다.\n\n> *예외: 웹의 경우 여러 패널이 표시되는 상황이라면 1개 이상의 값을 설정해도 됩니다. 이 경우에는 패널 당 하나씩 설정하는 것을 권장합니다.\n\n가이드 페이지(`1:273113`) 시각 구성 — 3개 sub-block:\n\n**Sub-block 1 (top, 2 Do + 1 Don't 3-column)**:\n\n| ✓ Do (위계 stacked) | ✓ Do (sheet) | ✗ Don't (2 primary) |\n|---|---|---|\n| primary / secondary / tertiary / subtle (1개씩) | Choose from library / Take new photo / Cancel | Primary / Primary / subtle |\n\n**Sub-block 2 (middle, Do horizontal hierarchy)**:\n- 행 1: Cancel(text) → tertiary `[Take new photo]` → secondary `[Take new photo]` → primary `[Choose from library]`\n- 행 2: subtle → tertiary → secondary → primary\n- 좌→우 위계 (primary가 가장 오른쪽)\n\n**Sub-block 3 (bottom, Don't horizontal)**:\n- 행 1: subtle → primary → tertiary → secondary (위계 뒤섞임)\n- 행 2: subtle → Primary → Primary (primary 2개)\n\n> **시각화 메모**: spec.html에서 가이드라인 카드 안의 버튼은 **자연 너비**(콘텐츠 크기) 사용. `width: 100%` / `flex: 1`로 영역 채우기 금지 — Figma 가이드 레이아웃 원본 따름.\n\n### 파괴적인 버튼 (`1:273181` verbatim)\n\nDestructive 버튼은 데이터를 영구적으로 삭제하는 것과 같이 **되돌리기 어렵거나 불가능한 작업에만** 사용하세요.\n\n파괴적인 행동에 대한 중요도가 낮을 경우, **Destructive-secondary** 버튼을 사용하세요.\n\n| ✓ Do | ✗ Don't |\n|---|---|\n| \"삭제하시겠습니까?\" + neutral-primary `[예]` / 아니오(text) | `[저장하기]` (destructive-primary) / 취소(text) — 일반 저장에 destructive 금지 |\n| \"삭제하시겠습니까?\" + destructive-primary `[삭제하기]` / 취소(text) |  |\n| destructive-primary `[Delete account]` / Cancel(text) |  |\n\n### 버튼 위계 (`1:273222` verbatim)\n\n버튼은 색상과 대비를 사용하여 세 가지 수준의 강조 및 계층 구조를 만듭니다.\n\n가장 강하게 강조된 버튼이 프라이머리 버튼(primary)이고, 그 다음이 세컨더리(secondary), 마지막이 터셔리 버튼(tertiary)입니다.\n\n대부분의 버튼에는 **뉴트럴 세컨더리(Neutral-Secondary)** 버튼을 사용하고 중요한 CTA 버튼에 **Neutral-primary** 버튼을 사용합니다.\n\n> *브랜드 프라이머리(Brand-primary) 버튼은 온라인 서비스의 경우, 주문, 결제 등 최종 단계의 CTA 버튼에 한정적으로 사용하세요.\n\n가이드 페이지(`1:273222`) 시각: 5행 가운데 정렬 — 좌측 위계 라벨(160px) + 우측 버튼(약 360px width).\n\n| 위계 | 예시 |\n|---|---|\n| Brand primary * | `[주문하기]` (orange) |\n| Neutral primary | `[저장하기]` (dark) |\n| Neutral secondary | `[수정하기]` (white + gray border) |\n| Neutral tertiary | `[수정하기]` (light gray) |\n| Subtle | `[취소]` (transparent text) |\n\n> **시각화 너비 가이드** (전체 가이드라인 공통):\n> - 짧은 라벨 (전송하기, 시작하기, 다음, 라벨): `min-width: 100px`\n> - 중간 라벨 (전체 dialog 버튼, Discard 등): `min-width: 80~240px`\n> - 긴 라벨 (긴 라벨을 사용하는 경우): `min-width: 280px`\n> - 위계 데모: `width: 360px` (라벨이 짧아도 시각 위계 강조)\n> - `width: 100%`로 컨테이너 전체 채우기 금지 — 버튼은 콘텐츠 + 적절한 여백 너비\n\n### 긴 라벨을 사용하는 경우 (`1:273260` verbatim)\n\n긴 라벨이 필요한 경우 버튼 그룹 레이아웃을 **Horizontal 에서 vertical 타입으로 전환**하여 적용하세요.\n\n버튼 위계에 맞게 위치를 사용하세요. **Primary 버튼은 오른쪽, 상단으로 적용**해야 합니다.\n\n| ✓ Do | ✗ Don't |\n|---|---|\n| Horizontal: 짧은 라벨 `[라벨]` `[라벨]` (primary 우측) | Horizontal: 긴 라벨 `[엄청 길고 긴 라벨을 사용하…]` `[엄청 길고 긴 라벨을 사용하…]` (overflow/잘림) |\n| Vertical: 긴 라벨 — primary `[긴 라벨을 사용하는 경우]` 상단 + secondary 하단 | Vertical: secondary 상단 + primary 하단 (위계 역전) |\n\n## 접근성 (`1:273285` verbatim)\n\n모든 사용자가 버튼의 기능을 인식하고 조작할 수 있도록, 아래 WCAG 및 ARIA 가이드라인을 준수합니다. 키보드, 스크린리더, 터치 등 다양한 입력 방식에서 일관된 접근성을 보장하여 사용 오류를 최소화합니다.\n\n### WCAG 2.2\n\n#### 키보드 접근성 (SC 2.1.1)\n모든 버튼은 Tab·Shift+Tab으로 포커스 이동이 가능하고, **Enter 또는 Space 키로 작동**해야 합니다.\n\n#### 포커스 가시성 (SC 2.4.7)\n버튼에 키보드 포커스가 있을 때 **2px 이상의 고대비 포커스 인디케이터**를 표시해야 합니다.\n\n#### 클릭 대상 크기 (PC 기준, SC 2.5.8)\n마우스·트랙패드 환경에서 클릭 가능한 버튼 목표(target)는 **최소 24×24 CSS 픽셀**을 확보해야 하며, 목표가 이보다 작을 경우 요소 간 **최소 24px 이상의 간격**을 유지해야 합니다.\n\n#### 비활성화 상태\n비활성화된 버튼은 시각적으로 명확히 구분되고, 클릭이 불가능해야 하며 **키보드 포커스에서 제외**됩니다.\n\n## 상호작용 가이드라인 (`1:273332` verbatim)\n\n### 탐색\n\n| 구분 | 설명 |\n|---|---|\n| Tab, Shift + Tab | 모든 버튼은 Tab, Shift + Tab 키를 눌렀을 때 접근할 수 있어야 한다. |\n\n### 실행\n\n| 구분 | 설명 |\n|---|---|\n| Click | 버튼의 동작을 실행시킨다. |\n| Enter, Space | 버튼이 초점을 가진 상태에서 버튼의 동작을 실행시킨다. |\n\n## Usage Notes\n\n- 본 프로젝트에서는 **neutral 톤만 사용** (brand 톤은 사용자 명시 지시 시에만)\n- 한 화면에 `*-primary` 1개만 (위계: primary → secondary → tertiary → text)\n- `common/*` 오버레이는 state별로 base 위에 알파 합성 (default 위에 hover/pressed 알파 깔기)\n- focused는 `common/focus-ring`(black) 단일 외부 링 — 버튼과 링 사이 투명 갭이 배경에 따라 흰색/회색으로 비침 (이전 \"이중 링\" 메모리 정정)\n- disabled 토큰 3종 공존:\n  - `disabled` (단순)\n  - `disabled-gray` (완전 비활성)\n  - `disabled-inactive` (읽기 전용 느낌)\n  → 호환성을 위해 모두 정의되어 있고, 신규 화면은 `disabled-gray` 권장\n- variant/instance API 호출 시 production `button`의 명칭 사용:\n  - style: `subtle` (이전 `text` 아님), `destructive-*` (이전 `distructive-*` 오타 정정)\n  - state: `disabled-gray` (이전 `Disabled` 아님)\n  - size: `_숫자` 접미사 포함 (`md_32` 등)\n  - prop 키는 모두 lowercase (`style`, `state`, `size`, `layout`, `type`)\n- 라벨은 Sentence case (한국어/영문 모두 첫글자만 대문자)\n", "components/calendar.md": "# Calendar\n\n> 출처: `figma-export.json` → Color_component(`896:76023`).\n> JS 토큰: `tokens/color/component.js#calendar`.\n> 토큰 prefix: `calendar/*`.\n\n## Overview\n- 치과 PMS 진료 일정/예약 캘린더\n- 날짜 셀 + 의사별/진료 종류별 마크 표시\n- 진료 종류 마커: 일반/응급/처방/입원/X-ray/예약/내원/야간 등\n\n## Color tokens (light / dark)\n\n### bg\n| token | light | dark |\n|---|---|---|\n| `calendar/bg/bg_default` | `#000000` | `#eeeeee` |\n| `calendar/bg/bg_dual` | `#0e0e0e` | `#e9e9e9` |\n| `calendar/bg/bg_day` | `#2b2b2b` | `#e9e9e9` |\n| `calendar/bg/bg_date` | `#000000` | `#e9e9e9` |\n| `calendar/bg/bg_active` | `#180a00` | `#fbdfcc` |\n| `calendar/bg/bg_select` | `#180a00` | `#fbdfcc` |\n| `calendar/bg/bg_hover` | `#1d1d1d` | `#dddddd` |\n\n### text\n| token | light | dark |\n|---|---|---|\n| `calendar/text/default` | `#ffffff` | `#1d1d1d` |\n| `calendar/text/select` | `#000000` | `#000000` |\n| `calendar/text/sunday` | `#df3422` | `#b12617` |\n| `calendar/text/saturday` | `#4069fd` | `#2549e5` |\n| `calendar/text/legend` | `#e9e9e9` | `#565656` |\n\n### border\n| token | light | dark |\n|---|---|---|\n| `calendar/border/default` | `#393939` | `#e9e9e9` |\n| `calendar/border/disabled` | `#a5a5a5` | `#dddddd` |\n| `calendar/border/thisweek` | `#0d7dba` | `#0d7dba` |\n\n### mark (진료 종류 표시)\n| token | light | dark |\n|---|---|---|\n| `calendar/mark/mark_doctor-1` | `#cf1f5c` | `#cf1f5c` |\n| `calendar/mark/mark_doctor-2` | `#d549eb` | `#d549eb` |\n| `calendar/mark/mark_doctor-3` | `#046959` | `#046959` |\n| `calendar/mark/mark_doctor-4` | `#b0623b` | `#b0623b` |\n| `calendar/mark/mark_first` | `#533400` | `#533400` |\n| `calendar/mark/mark_return` | `#3c7a0f` | `#3c7a0f` |\n| `calendar/mark/mark_medication` | `#0d7dba` | `#0d7dba` |\n| `calendar/mark/mark_imaging` | `#9d4ee4` | `#9d4ee4` |\n| `calendar/mark/mark_lab-test` | `#98073c` | `#98073c` |\n| `calendar/mark/mark_icon` | `#dddddd` | `#a5a5a5` |\n| `calendar/mark/bg_general` | `#df3422` | `#df3422` |\n| `calendar/mark/bg_inpatient` | `#03545c` | `#03545c` |\n| `calendar/mark/bg_reservation` | `#73180b` | `#73180b` |\n\n### legend (범례)\n| token | light | dark |\n|---|---|---|\n| `calendar/legend/bg_first` | `#533400` | `#da9f00` |\n| `calendar/legend/bg_return` | `#3c7a0f` | `#64be23` |\n| `calendar/legend/bg_medication` | `#0d7dba` | `#0d7dba` |\n| `calendar/legend/bg_imaging` | `#9d4ee4` | `#9d4ee4` |\n| `calendar/legend/bg_lab-test` | `#98073c` | `#98073c` |\n| `calendar/legend/bg_general` | `#df3422` | `#ff8678` |\n| `calendar/legend/bg_inpatient` | `#03545c` | `#0cad8e` |\n| `calendar/legend/bg_reservation` | `#7b002d` | `#ffa3c2` |\n| `calendar/legend/bg_night` | `#53009f` | `#eee0fa` |\n| `calendar/legend/bg_icon` | `#dddddd` | `#a5a5a5` |\n\n## Variants\n- 진료 종류·의사별 마크 색상이 정의됨\n- 일·토요일 별도 색상 (sunday/saturday)\n- thisweek 강조 border (`#0d7dba`)\n- bg_dual: 2주 보기 등 듀얼 모드\n- bg_active vs bg_select: active는 hover/focus, select는 선택된 날짜\n\n## Usage Notes\n\n- 진료 종류·의사별 색상은 dark 모드에서도 동일 (가독성/일관성)\n- 일요일은 빨강, 토요일은 파랑 (한국 관행)\n- thisweek 행은 border로 강조\n- legend(범례)는 캘린더 하단 색상-라벨 매핑\n- mark_* 토큰은 점/막대 형태 마크에 사용\n- bg_* (legend/mark)는 배지/태그 형태 표시에 사용\n", "components/card.md": "# Card\n\n> 출처:\n> - **공통 컴포넌트(Copy)** file `lIIen1jmIhT0vuyXCMQDQA` / section `2395:35765` `card_0407`\n>   - `2395:35784` `card_slot` (wrapper — **25 variants**, 2축)\n>   - `2395:36013` `card_element_0401` (내부 — **12 variants**, 3축)\n>   - `2395:36182` `img_test_2` (이미지 placeholder 407×300)\n>   - `2395:36218` `image_22` (이미지 small 70×70)\n> - **UI-Kit-Guide** file `ky00DVb1Q3RmiMlYWwdSGG` / `1:406332`\n> - `figma-export.json` (2026-05-04 export)\n>\n> JS 토큰: `tokens/color/component.js#card`, `tokens/number/component.js#card`.\n> 토큰 prefix: `card/*`.\n\n## Overview\n- 콘텐츠 그룹화 컨테이너\n- 모드: **light** (production variable_defs 기준)\n- 2 컴포넌트:\n  - `card_slot` (외부 wrapper) — type 5종 × state 5종 = 25 variants\n  - `card_element_0401` (내부 element/footer) — state × align × button count = 12 variants\n\n## Number tokens (Mode 1)\n\n| token | px |\n|---|---|\n| `card/corner radius sm` | 12 |\n| `card/corner radius md` | 8 (figma-export 기준) |\n\n> 가이드 기준 기본 radius는 sm=12 (둥근 모서리).\n\n## Color tokens — production (light)\n\n### bg / border (state별)\n| token | light | 비고 |\n|---|---|---|\n| `Static/Neutral Gray/0` | `#ffffff` | bg default |\n| `Static/Neutral Gray/50` | `#f4f4f4` | bg pressed |\n| `Static/Gray/300` | `#dadada` | border default |\n| `Static/Gray/800` | `#292929` | border hover/pressed |\n| `Static/Orange/600` | `#fc7d00` | border selected (brand orange variant) |\n| `Static/Neutral Gray/999` | `#020202` | focus ring outer |\n| `Static/Gray/400` | `#c6c6c6` | disabled |\n\n### text (text-on-color)\n| token | light |\n|---|---|\n| 카드 title (Bold 16) | `text input/text/label` 또는 검정 |\n| 카드 body (Medium 14) | `#393939` 또는 `text-secondary` |\n| 카드 description (Regular 12) | `#a5a5a5` |\n\n## Wrapper Variants — `card_slot` (2축, 25 variants)\n\n### prop verbatim\n- **type**: `basic` / `vertical` / `horizontal` / `harf` / `filled` (5가지 — `harf`는 `half` 오타!)\n- **state**: `default` / `hover` / `pressed` / `focus` / `selected` (5가지)\n\n총 5 × 5 = **25 variants**\n\n### Variant IDs\n\n| state \\\\ type | basic | vertical | horizontal | filled | harf |\n|---|---|---|---|---|---|\n| default | `2395:35797` | `2395:35785` | `2395:35805` | `2395:35829` | `2395:35817` |\n| hover | `2395:35799` | `2395:35788` | `2395:35808` | `2395:35832` | `2395:35820` |\n| pressed | `2395:35803` | `2395:35794` | `2395:35814` | `2395:35838` | `2395:35826` |\n| focus | `2395:35841` | `2395:35845` | `2395:35850` | `2395:35855` | `2395:35860` |\n| selected | `2395:35801` | `2395:35791` | `2395:35811` | `2395:35835` | `2395:35823` |\n\n> 컴포넌트 셋 mannequin 크기는 모두 360×360. 실제 canvas instance는 type별로 크기 다름 (아래 참조).\n\n### type별 의미 (UI-Kit-Guide `352:35727` verbatim — 신규 가이드 파일 `LxBPQF1oFOfiNdX5qzLcik`)\n\n> 카드는 콘텐츠 성격과 배치 방식에 따라 구분합니다. **Basic, Vertical, Horizontal, Filled, Half**의 총 5가지 형태를 제공합니다.\n\n> **시각화 사이즈 메모** (spec.html 한정): Figma 가이드 페이지는 label/설명을 display_xs(24px / lh 40)로 표기하지만, spec sheet 시각화에서는 가독성과 밀도를 위해 label 18px(SemiBold) / 설명 14px(Regular, lh 22)로 축소 렌더. type 카드 본체(360×*)와 내부 콘텐츠(328×*)는 Figma verbatim 유지.\n\n> **시각화 비율 조정** (`1:406506` 가이드 실 사용 예 기반):\n> - Horizontal: 가이드 mannequin은 image 80×328 / body 238×328 (총 360×360)이지만, 실 사용 예시(`352:35760`)는 image 296×218 사용. spec.html은 비율 균형을 위해 `max-width: 520px`, `image: 40% / body: flex 1`로 렌더 (좁은 컬럼 들어가도 협소하지 않게).\n> - Filled/Half body: 가이드 spec은 fixed `height: 143px`이지만, body 콘텐츠(title + body text + button)가 좁은 폭에서 더 많은 줄을 차지하면 잘릴 수 있어 `min-height: 143px` + `gap: 4px` + `padding: 14px 16px`로 자동 확장하도록 조정. body width는 카드 폭에 맞춰 `width: 100%`로 반응형.\n> - **body 내 button 하단 고정**: `.card-body-slot .card-btns { margin-top: auto; }` — Horizontal/Vertical/Filled/Half 모두 이미지와 button이 카드 상하 양 끝에 정렬되어 시각 균형 유지. 본문(title/body/desc/badge/price)은 자연 위에서부터 흐름.\n> - **Horizontal 4면 정렬 핵심**: 카드의 fixed `height` 제거 + image `min-height: 220px`만 설정. parent의 `align-items: stretch`가 image와 body를 항상 같은 높이로 강제 → 이미지 상단 == 텍스트 상단, 이미지 하단 == 버튼 하단. 콘텐츠가 길어지면 image도 따라 늘어남. (이전 fixed 260px 높이는 좁은 컬럼에서 body text가 4줄 이상 wrap 되면 image와 정렬이 어긋났음.)\n\n| type | 가이드 verbatim 설명 | 시각 구조 |\n|---|---|---|\n| `Basic` | 텍스트 중심의 기본 카드입니다. 제목, 보조 정보, 가격 또는 최소 상태, CTA 등 최소 구성으로 이루어지며, 가장 범용적으로 사용할 수 있습니다. | 이미지 없음, 텍스트만 |\n| `Vertical` | 상단 이미지와 하단 정보가 수직으로 배치된 형태입니다. 상품 및 일반형 카드에 적합합니다. | 카드 padding 안쪽 상단에 이미지(rounded) + 하단 텍스트. **full bleed 아님** |\n| `Horizontal` | 이미지와 텍스트가 좌우로 배치된 형태입니다. 리스트형 카드에 적합합니다. | 카드 padding 안쪽 좌측에 이미지(rounded) + 우측 텍스트. **full bleed 아님** |\n| `Filled` | 카드 전체를 비주얼 또는 배경으로 활용하는 형태입니다. 프로모션 및 배너형 콘텐츠에 적합합니다. | 카드 전체가 이미지 배경, 텍스트는 이미지 위에 직접 (overlay 박스 없음) |\n| `Half` | 상하 또는 좌우로 영역을 분할한 형태입니다. 정보와 비주얼을 구분해 보여줄 때 적합합니다. | 상단 이미지(border radius 0) + 하단 흰색 텍스트 영역 — 영역 분할 |\n\n> **`harf` ↔ `Half` 표기 정정**: 신규 가이드 파일에서는 `Half`로 정정됨. 단, production component file (`2395:35784`)의 variant prop은 여전히 `harf` 오타 보존 — variant 매칭 시 코드는 `harf`, 디자인 문서는 `Half` 사용.\n\n### type별 instance 실측 크기\n\n| type | width × height | image slot | body slot |\n|---|---|---|---|\n| basic | 360 × 250 | (없음) | 328×218 (pad 16) |\n| vertical | 360 × 330 | 328×70 top | 328×218 |\n| horizontal | 777 × 332 | 407×300 left | 328×218 |\n| filled | 360 × 420 | 360×420 full | 360×168 (bottom overlay, transparent) |\n| harf | 360 × 420 | 360×420 full | 360×168 (bottom overlay, white BG) |\n\n> mannequin variant 크기는 통일된 360×360, 실 사용 시 콘텐츠에 맞춰 instance resize.\n\n## Element Variants — `card_element_0401` (3축, 12 variants)\n\nset ID: `2395:36013`. 카드 내부의 텍스트+버튼 영역.\n\n### prop verbatim\n- **state**: `Default` / `disabled` (대문자 D)\n- **align**: `left` / `right` / `center`\n- **button count**: `1` / `2`\n\n총 2 × 3 × 2 = **12 variants** (frame 328×218)\n\n### Variant IDs\n\n| state \\\\ align \\\\ count | left/1 | left/2 | right/1 | right/2 | center/1 | center/2 |\n|---|---|---|---|---|---|---|\n| Default | `2395:36014` | `2395:36066` | `2395:36040` | `2395:36096` | `2395:36126` | `2395:36152` |\n| disabled | `2395:36027` | `2395:36081` | `2395:36053` | `2395:36111` | `2395:36139` | `2395:36167` |\n\n> 일부 대체 ID (`2395:36053`, `36139` 등)는 같은 prop 조합의 중복/대체 variant로 추정.\n\n## Anatomy\n\n### card_slot (basic — 가장 단순)\n```\n┌─────────────────────────┐  ← bg #ffffff, border 1px #dadada (default)\n│  ┌─────────────────┐    │\n│  │ body text slot  │    │  ← card_element_0401 내부 (328×218)\n│  │ (16 padding)    │    │\n│  └─────────────────┘    │\n└─────────────────────────┘\n```\n\n### card_slot (vertical)\n```\n┌─────────────────────────┐\n│  ┌─────────────────┐    │\n│  │ image (328×70)  │    │  ← 상단 이미지\n│  └─────────────────┘    │\n│  ┌─────────────────┐    │\n│  │ body text       │    │  ← 하단 콘텐츠\n│  └─────────────────┘    │\n└─────────────────────────┘\n```\n\n### card_slot (horizontal)\n```\n┌─────────┬───────────┐\n│         │           │\n│ image   │ body text │  ← 좌 이미지(407×300) + 우 콘텐츠(328×218)\n│ 407×300 │ 328×218   │\n└─────────┴───────────┘\n```\n\n### card_slot (filled / harf — 이미지 위 텍스트 overlay)\n```\n┌─────────────────────────┐\n│                         │\n│       full image        │  ← 360×420 가득\n│                         │\n│  ┌─────────────────┐    │\n│  │ text overlay    │    │  ← bottom 360×168\n│  │ filled: trans   │    │     filled = 투명 BG\n│  │ harf:   white   │    │     harf = 흰 BG (오타: harf=half)\n│  └─────────────────┘    │\n└─────────────────────────┘\n```\n\n### card_element_0401 (frame 328×218)\n```\n┌─────────────────────────┐\n│ Title                   │  ← Pretendard Bold 16\n│ Body text Medium 14     │\n│ Description Regular 14  │\n│ • Price Medium 16       │\n│ [Badge Regular 12]      │\n│ [Button SemiBold 16]    │  ← 1 또는 2 버튼 (button count)\n└─────────────────────────┘\n```\n\n## State (UI-Kit-Guide `1:406577` verbatim)\n\n> 카드는 상호작용과 정보 전달을 위해 상태를 가집니다.\n> 모든 유형은 공통된 상태 원칙을 따르며, 유형별 표현 방식만 달라질 수 있습니다.\n\n카드는 **6가지 상태**로 구성됩니다:\n\n| state | bg | border | 시각 |\n|---|---|---|---|\n| `Default` | `#ffffff` | `#dadada` 1px | 기본 상태 — 흰 배경 + 라이트 그레이 외곽선 |\n| `Hover` | `#ffffff` | `#292929` | 마우스 오버 — 진한 외곽선으로 강조 |\n| `Pressed` | `#f4f4f4` | `#292929` | 클릭/탭 중 — 옅은 회색 배경 + 진한 외곽선 |\n| `Focus` | `#ffffff` | black 2px outline ring | 키보드 tab focus — black outline ring |\n| `Selected` | `#ffffff` | `#fc7d00` (brand orange) | 사용자가 선택한 활성 상태 — orange 외곽선 |\n| `Disabled` | `#ffffff` | `#dadada` 1px | 비활성화 상태 — 콘텐츠 전체가 흐려짐 (opacity 0.4) |\n\n> 가이드 페이지(`1:406577`) 2×3 그리드 verbatim. (이전 `352:35789` 6-state 메모리는 BUTTON 상태로 잘못 매핑된 것이었고, 본 표는 CARD 자체의 상태.)\n\n## Typography\n\n| 영역 | textStyle | font · size · line-height |\n|---|---|---|\n| Title | `body/sm (B)` | Pretendard 700 / 16 / 24 |\n| Body | `body/xs (M)` | Pretendard 500 / 14 / 20 |\n| Description | `body/xs (R)` | Pretendard 400 / 14 / 20 |\n| Caption | `caption/sm (R)` | Pretendard 400 / 12 / 16 |\n| Button | `button/lg (SB)` | Pretendard 600 / 16 / 24 |\n| Body (Medium) | `body/sm (M)` | Pretendard 500 / 16 / 24 |\n\n> v0.4 textStyle 기준. 이전 메모리 \"Bold 16 / Medium 14\"와 일치.\n\n## Usage Notes\n\n- variant 매칭 verbatim:\n  - `type=basic` / `vertical` / `horizontal` / `filled` / **`harf`** (Figma 오타 — `half` 아님!)\n  - `state=default` / `hover` / `pressed` / `focus` / `selected`\n  - element: `state=Default` (대문자 D) / `disabled`\n  - element: `align=left` / `right` / `center`\n  - element: `button count=1` / `2` (공백 포함)\n- `harf`는 의도적 오타 (Figma 원본 표기) — variant 매칭 시 그대로 사용\n- type 차이 명확화:\n  - `harf` (= half): 이미지 위 + **흰색 텍스트 영역** (overlay 가독성 ↑)\n  - `filled`: 이미지 위 + **투명 텍스트 영역** (이미지가 텍스트 너머로 보임)\n- selected 시 border = brand orange (`#fc7d00`)\n- focus는 **이중 ring** (외곽 2px black + 내부 진한 회색) — 단일 ring 금지\n- card_element_0401은 카드 내부의 콘텐츠 영역 (텍스트 + 버튼 묶음)\n- button count=1: 단일 버튼 (예: \"자세히 보기\")\n- button count=2: 2 버튼 (예: 좌 cancel + 우 primary action)\n- align=left: 텍스트 좌측, 버튼 좌측\n- align=center: 텍스트 중앙, 버튼 중앙 (강조 카드)\n- align=right: 텍스트 우측, 버튼 우측\n- 카드 mannequin 크기는 360×360, 실 사용 시 콘텐츠에 맞춰 resize 가능\n- horizontal type만 너비 777 (이미지 영역 추가)\n", "components/checkbox.md": "# Checkbox\n\n> 출처:\n> - **공통 컴포넌트(Copy)** file `lIIen1jmIhT0vuyXCMQDQA`:\n>   - `981:166538` `CheckboxV02` (production component)\n> - **UI-Kit-Guide** file `ky00DVb1Q3RmiMlYWwdSGG`:\n>   - `1:341738`, `1:341167`, `1:340767` (가이드 페이지)\n>\n> JS 토큰: `tokens/color/component.js#checkbox`, `tokens/number/component.js#selectionControl`.\n> 토큰 prefix: `control/*`, `selection control/*`.\n\n## Overview\n- Selection Control 그룹 (checkbox + radio + switch) 중 하나 — `control/*` 토큰 공유\n- 모드: **light** (production variable_defs 기준)\n- production 컴포넌트: `CheckboxV02` (`981:166538`)\n- 4축 prop + 3 boolean (variants 풀 매트릭스)\n\n## Number tokens (Mode 1)\n\n### selection control / icon (체크박스 영역, px)\n| size | container | inner box | token |\n|---|---|---|---|\n| sm | 20 | **16** | `selection control/icon/sm` = 16 |\n| md | 24 | **19.2** | `selection control/icon/md` = 20 (figma-export) |\n| lg | 32 | **24** | `selection control/icon/lg` = 24 |\n\n> production 노드는 inner box가 sm=16 / md=19.2 / lg=24 — figma-export.json 기준 sm=16/md=20/lg=24와 미세 차이.\n\n### selection control / text (라벨 사이즈)\n| size | text size |\n|---|---|\n| sm | 14 (`body/sm`) |\n| md | 16 (`body/md`) |\n| lg | 18 (`body/lg`) |\n\n### border 굵기 (size별)\n| size | border |\n|---|---|\n| sm | 1 |\n| md | 1.2 |\n| lg | 1.5 (또는 1.875 indeterminate) |\n\n### focus ring (size별, inset border)\n| size | ring 두께 |\n|---|---|\n| sm | 2 |\n| md | 2.4 |\n| lg | 2 (inset 2px) |\n\n## Variants — production prop verbatim\n\n### prop verbatim\n- **active**: `unchecked` / `checked` / `indeterminate`\n- **state**: `default` / **`active`** / `disabled` (3 values — `hover`/`pressed`는 `active`로 통합!)\n- **style**: `Standard` / `Ranking` (대문자 첫글자)\n- **size**: `sm` / `md` / `lg`\n- **focusRing**: boolean (focus ring 표시)\n- **label**: boolean (라벨 표시)\n- **requiredMark**: boolean (`*` 필수 표시)\n- **text**: string (라벨 콘텐츠 — default \"Label\")\n- **ver**: `default`\n\n> **중요 정정**: state는 `default / hover / pressed / disabled` 4개가 아닌 **`default / active / disabled` 3개**. `hover`와 `pressed`는 `active`로 통합됨.\n\n## Color tokens — production (light)\n\n### bg\n| token | light |\n|---|---|\n| `control/bg/bg-default` | `#fefefe` (unchecked 배경) |\n| `control/bg/bg-brand-1` | `#eb6100` (checked / indeterminate 배경 — orange) |\n| `control/bg/bg-disabled` | `#d2d2d2` |\n\n### border\n| token | light |\n|---|---|\n| `control/border/border-default` | `#727272` |\n| `control/border/border-brand` | `#eb6100` (active/checked 시 brand) |\n| `control/border/border-disabled` | `#a5a5a5` |\n\n### fg (체크 마크)\n| token | light |\n|---|---|\n| `control/fg/fg-default` | `#fefefe` (check 마크 흰색) |\n| `control/fg/fg-disabled` | `#a5a5a5` |\n\n### text\n| token | light |\n|---|---|\n| `control/text/text-default` | `#565656` |\n| `control/text/text-active` | `#1d1d1d` (active state 시 검정) |\n| `control/text/text-disabled` | `#a5a5a5` |\n\n### Ranking style\n| token | light |\n|---|---|\n| `Color/selection/surface/surface-ranking` | `#faec88` (노란 배경) |\n| `control/common/fg-ranking` | `#1d1d1d` (숫자 텍스트) |\n\n> Ranking은 노란 동그라미 안에 숫자(1, 2, 3...) 표시 — 우선순위/등급 체크.\n\n## State별 시각 (Standard style)\n\n| state \\\\ active | unchecked | checked | indeterminate |\n|---|---|---|---|\n| default | bg=`#fefefe` + border=`#727272` | bg=`#eb6100` + check=`#fefefe` | bg=`#eb6100` + dash=`#fefefe` |\n| active | bg=`#fefefe` + border=`#eb6100` | bg=`#eb6100` + check=`#fefefe` | bg=`#eb6100` + dash=`#fefefe` |\n| disabled | bg=`#d2d2d2` + border=`#a5a5a5` | bg=`#d2d2d2` + check=`#a5a5a5` | bg=`#d2d2d2` + dash=`#a5a5a5` |\n\n> active state는 hover/focus 통합 — keyboard tab 또는 마우스 hover 시 border만 brand로 변경.\n\n## Anatomy\n\n```\n[ ☑ ] Label *   ← gap 4 (sm) / 8 (lg) — between box and label\n  ↑     ↑    ↑\n  box   text required mark\n  \nsm: 16×16 box, gap 4, text 14\nmd: 19.2×19.2 box, gap 4, text 16\nlg: 24×24 box, gap 8, text 18\n```\n\n### Standard style anatomy\n- 사각 box (radius 0 — 각진)\n- check / dash 마크: `fg/fg-default` 흰색\n- focus ring: 2~3.2px black inset\n\n### Ranking style anatomy\n- 동그라미 box (radius=full)\n- 노란 배경 (`#faec88`)\n- 숫자 텍스트 (`#1d1d1d`, Pretendard Bold)\n- focus ring: rounded inset\n\n## Typography\n\n| size | textStyle (default) | textStyle (active state) |\n|---|---|---|\n| sm | `body/sm` (14/20 Regular) | `body/sm (SB)` (14/20 SemiBold) |\n| md | `body/md` (16/24 Regular) | `body/md (SB)` (16/24 SemiBold) |\n| lg | `body/lg` (18/26 Regular) | `body/lg (SB)` (18/26 SemiBold) |\n\n> **state=active일 때 SemiBold 자동 적용** (이전 `unchecked → 400, checked → 600`도 같은 효과).\n\n## Required mark\n- 색상: `Color(New)/Red/500` `#ef0101`\n- 폰트: Malgun Gothic Regular 14\n- 위치: 라벨 우측 (gap 4)\n- 표시: `*` 단일 문자\n\n## Description (Figma `1:340767` verbatim)\n\n체크박스(Checkbox)는 사용자에게 둘 이상의 항목 중에서 복수 선택이 가능하도록 제공하는 사용자 인터페이스(UI) 요소입니다. 각 항목은 서로 독립적이며, 사용자는 필요에 따라 하나 이상을 선택하거나 선택을 해제할 수 있습니다. 체크박스는 보통 설정 옵션이나 다중 응답이 필요한 설문 항목 등에서 사용되며, 선택 여부는 사각형 박스 안에 체크(✓)로 표시됩니다.\n\n예외적으로 선택/해제의 여부 자체가 의미를 가지는 경우, 단일 응답에서도 사용합니다.\n\n## Anatomy (verbatim)\n\n체크박스는 checkbox와, Label로 구성되어 있습니다.\n\n| 요소 | 설명 |\n|---|---|\n| 체크박스 (Checkbox) | 체크박스의 현재 선택 상태 |\n| 라벨 (Label) | 선택하거나 선택 해제할 개체의 정보 |\n\n## Properties (verbatim)\n\n### Size\n체크박스는 small, medium, large 총 3가지의 사이즈로 제공합니다.\n\n### Layout (Figma `1:340885` verbatim)\n체크박스는 3가지 레이아웃으로 제공합니다.\n\n| Layout 종류 | 시각 |\n|---|---|\n| `checkbox only` | `[ ]` (체크박스만, 라벨/요구마크 없음) |\n| `with label` | `[ ] Label` (체크박스 + 라벨) |\n| `label and required mark` | `[ ] Label *` (체크박스 + 라벨 + 필수 마크) |\n\n### State & Variant\n체크박스는 default, active, disabled 3가지의 state를 가지며, unchecked, checked, indeterminate 의 선택 상태값과 각 상태별 focus 에 따른 다양한 variant를 나타낼 수 있습니다.\n\n> Ranking variant는 production 컴포넌트(`981:166538`)에 추가 정의되어 있으며 가이드 페이지에는 별도 명시되지 않음 (노란 동그라미 + 숫자, 우선순위 표시).\n\n## Guidelines (verbatim)\n\n### 좌측 정렬 (Figma `1:340971` verbatim)\n체크박스를 사용자 인터페이스(UI)에 배치할 때, 자연스러운 시선의 흐름을 위해 항목의 왼쪽(좌측)에 정렬하여 배치하는 것을 권장합니다. 사용자가 화면을 위에서 아래로, 왼쪽에서 오른쪽으로 자연스럽게 읽어나갈 때 시선이 흔들리지 않고 안정적으로 흐를 수 있습니다. 또한 체크박스들이 일정한 위치에 정렬되어 있으면 전체 레이아웃이 일관되고 정돈된 느낌을 주기 때문에, 사용자 입장에서 보기 쉽고 사용하기도 편해집니다.\n\nDo/Don't (가이드 페이지 verbatim 표 layout):\n\n**Do** — 체크박스가 좌측 첫 컬럼:\n| ☐ | 구분 | 상태 |\n|---|---|---|\n| ☐ | [비보험] | 골유도재생술(GBR) |\n| ☐ | [비보험] | 인조골이식 |\n| ☐ | [보험] | 자가골 채취, 이식 |\n\n**Don't** — 체크박스가 우측 마지막 컬럼:\n| 구분 | 상태 | ☐ |\n|---|---|---|\n| [비보험] | 골유도재생술(GBR) | ☐ |\n| [비보험] | 인조골이식 | ☐ |\n| [보험] | 자가골 채취, 이식 | ☐ |\n\n> **시각화 메모**: spec.html에서 Do/Don't 카드 내부 표는 **table 자체에만 `background: #ffffff` 적용** (외곽 wrapper 박스 padding 없음). 표 셀(td/th)만 흰색이고 카드 외곽 톤(Do gray / Don't pink)이 표 주위 padding 영역에 자연스럽게 노출 — Figma `1:340971` 표 영역과 동일.\n\n### 라벨 제공 (Figma `1:341036` verbatim)\n체크박스에는 명확하고 구체적인 레이블(텍스트)을 제공하여 사용자가 항목의 의미를 쉽게 이해하고 체크박스를 선택/해제 할 수 있도록 합니다. 명확한 레이블 없이 사용할 경우, 접근성이 낮아지고 불편함을 주며, 사용자 입장에서 체크의 의미가 모호할 수 있습니다.\n\n**Do**:\n- ☐ 알림받기 설정\n- ☐ 오늘 하루 다시 보지 않기\n\n**Don't**:\n- ☐ 🔔 (이모지/아이콘만 — 의미 모호)\n- ☐ 알림 (라벨이 있으나 너무 모호)\n\n## 접근성 (Figma verbatim)\n\n> ⚠ Figma 원본 본문은 \"버튼\"으로 표기 — Button 페이지에서 복사된 것으로 보임. 의미상은 \"체크박스\".\n\n모든 사용자가 버튼의 기능을 인식하고 조작할 수 있도록, 아래 WCAG 및 ARIA 가이드라인을 준수합니다. 키보드, 스크린리더, 터치 등 다양한 입력 방식에서 일관된 접근성을 보장하여 사용 오류를 최소화합니다.\n\n### WCAG 2.2\n\n#### 키보드 접근성 (SC 2.1.1)\n모든 버튼은 Tab·Shift+Tab으로 포커스 이동이 가능하고, Enter 또는 Space 키로 작동해야 합니다.\n\n#### 포커스 가시성 (SC 2.4.7)\n버튼에 키보드 포커스가 있을 때 2px 이상의 고대비 포커스 인디케이터를 표시해야 합니다.\n\n#### 클릭 대상 크기 (PC 기준, SC 2.5.8)\n마우스·트랙패드 환경에서 클릭 가능한 버튼 목표(target)는 최소 24×24 CSS 픽셀을 확보해야 하며, 목표가 이보다 작을 경우 요소 간 최소 24px 이상의 간격을 유지해야 합니다.\n\n#### 비활성화 상태\n비활성화된 버튼은 시각적으로 명확히 구분되고, 클릭이 불가능해야 하며 키보드 포커스에서 제외합니다.\n\n## 상호작용 가이드라인 (Figma verbatim)\n\n> ⚠ Figma 원본 본문은 \"버튼\"으로 표기 — Button 페이지에서 복사된 것으로 보임. 의미상은 \"체크박스\".\n\n### 탐색\n\n| 구분 | 설명 |\n|---|---|\n| Tab, Shift + Tab | 모든 버튼은 Tab, Shift + Tab 키를 눌렀을 때 접근할 수 있어야 한다. |\n\n### 실행\n\n| 구분 | 설명 |\n|---|---|\n| Click | 버튼의 동작을 실행시킨다. |\n| Enter, Space | 버튼이 초점을 가진 상태에서 버튼의 동작을 실행시킨다. |\n\n## Usage Notes\n\n- variant 매칭 verbatim:\n  - `active=unchecked` / `checked` / `indeterminate`\n  - `state=default` / `active` / `disabled` (이전 hover/pressed/focused 단일화)\n  - `style=Standard` (대문자 S) / `Ranking` (대문자 R)\n  - `size=sm` / `md` / `lg`\n  - boolean: `focusRing=true|false`, `label=true|false`, `requiredMark=true|false`\n- text prop으로 라벨 텍스트 동적 (default \"Label\")\n- checked 시 box bg = brand orange (`#eb6100`) — `control/bg/bg-brand-1`\n- active state는 hover/focus 통합 — border만 orange로 변경\n- Ranking style은 등급/우선순위 표시 (1, 2, 3 등)\n- Required(`*`)는 폼 필수 입력 표시 — `Color(New)/Red/500` (`#ef0101`)\n- focus ring은 키보드 포커스용 (Tab navigation)\n- 폰트 두께는 state=active 시 SemiBold로 자동 변경 (active = checked + state.active 모두)\n", "components/chip.md": "# Chip\n\n> 출처:\n> - **공통 컴포넌트(Copy)** file `lIIen1jmIhT0vuyXCMQDQA` / section `2913:178643` `Chip`\n> - 컴포넌트 셋:\n>   - `2879:150759` `chip` (atom — **42 variants**, 3축)\n>   - `3799:9153` `Chip Group` (group wrapper — 3 variants, size 단일축)\n> - **UI-Kit-Guide** file `ky00DVb1Q3RmiMlYWwdSGG`:\n>   - `1:220044`, `1:220647` (가이드 페이지)\n> - `figma-export.json` (2026-05-04 export)\n>\n> JS 토큰: `tokens/color/component.js#chip`, `tokens/number/component.js#chip`.\n> 토큰 prefix: `chip/*`.\n\n## Overview\n- 필터/선택형 작은 라벨 버튼\n- 모드: **light** (production variable_defs 기준)\n- 2 컴포넌트:\n  - `chip` (atom): 단일 chip 인스턴스\n  - `Chip Group` (wrapper): 여러 chip 슬롯 컨테이너 (size 통일)\n\n## Number tokens (Mode 1)\n\n### height (px)\n| size | token | height |\n|---|---|---|\n| xs | `chip/height/xs` | 28 |\n| sm | `chip/height/sm` | 32 |\n| md | `chip/height/md` | 40 |\n\n### padding (좌우, px)\n| size | token | padding |\n|---|---|---|\n| xs | `chip/padding/sm` | 8 |\n| sm | `chip/padding/md` | 10 |\n| md | `chip/padding/lg` | 12 |\n\n### gap (icon ↔ text, px)\n| size | token | gap |\n|---|---|---|\n| xs | `chip/gap/xs` | 4 |\n| sm | `chip/gap/sm` | 6 |\n| md | `chip/gap/md` | 8 |\n\n### radius (px)\n| shape | token | radius |\n|---|---|---|\n| rounded (pill) | `chip/radius/circle` | 999 (production) / 480 (가이드 추정값) |\n| sqaure | `chip/radius/xs` | 4 |\n\n> **shape 오타 보존**: `sqaure` (Figma 원본 그대로, `square` 아님).\n\n## Color tokens — production (light)\n\n### bg (state별)\n| token | light |\n|---|---|\n| `chip/bg/default` | `#ffffff` |\n| `chip/bg/hover` | `#f4f4f4` |\n| `chip/bg/disabled` | `#f4f4f4` |\n| `chip/bg/selected-orange` | `#ef8133` (selected_filled_brand 의 bg) |\n| `chip/bg/selected-gray` | `#505050` (selected_filled_gray 의 bg) |\n\n### outline (border)\n| token | light |\n|---|---|\n| `chip/outline/default` | `#bcbcbc` |\n| `chip/outline/selected` | `#ef8133` (selected_outline 의 border) |\n| `chip/outline/focused` | `#000000` (focus state ring) |\n| `chip/outline/disabled` | `#eeeeee` |\n\n### font\n| token | light |\n|---|---|\n| `chip/font/default` | `#393939` |\n| `chip/font/selected` | `#eb6100` (selected_outline 등에서 텍스트) |\n| `chip/font/invert` | `#ffffff` (filled brand/gray 위 흰 텍스트) |\n| `chip/font/disabled` | `#a5a5a5` |\n\n### icon\n| token | light |\n|---|---|\n| `chip/icon/default` | `#565656` |\n| `chip/icon/selected` | `#eb6100` |\n| `chip/icon/invert` | `#ffffff` |\n| `chip/icon/disabled` | `#a5a5a5` |\n\n## Variants — 3축 (verbatim)\n\n### atom prop verbatim\n- **state**: `default` / `hover` / `selected_outline` / **`selected_filled_brand`** / **`selected_filled_gray`** / `focus` / `disabled` (7가지)\n- **shape**: `rounded` / **`sqaure`** (Figma 오타 보존)\n- **size**: `xs` / `sm` / `md` (3가지)\n\n총 7 × 2 × 3 = **42 variants**\n\n> **이전 문서 정정**:\n> - `selected_filled_orange` → **`selected_filled_brand`** (이름 변경됨)\n> - `focused` → **`focus`** (state 명 단축)\n> - atom의 size는 `xs/sm/md` (이전 `xsm/sm/md`는 group 전용)\n\n### state별 시각 매핑\n| state | bg | outline | font | icon |\n|---|---|---|---|---|\n| default | `bg/default` `#ffffff` | `outline/default` `#bcbcbc` | `font/default` `#393939` | `icon/default` `#565656` |\n| hover | `bg/hover` `#f4f4f4` | `outline/default` | `font/default` | `icon/default` |\n| selected_outline | `bg/default` (transparent fill) | `outline/selected` `#ef8133` | `font/selected` `#eb6100` | `icon/selected` `#eb6100` |\n| selected_filled_brand | `bg/selected-orange` `#ef8133` | none | `font/invert` `#ffffff` | `icon/invert` `#ffffff` |\n| selected_filled_gray | `bg/selected-gray` `#505050` | none | `font/invert` `#ffffff` | `icon/invert` `#ffffff` |\n| focus | `bg/default` | `outline/focused` `#000000` 2px | `font/default` | `icon/default` |\n| disabled | `bg/disabled` `#f4f4f4` | `outline/disabled` `#eeeeee` | `font/disabled` `#a5a5a5` | `icon/disabled` `#a5a5a5` |\n\n## Variant IDs — atom\n\n### state=default\n| size \\\\ shape | rounded | sqaure |\n|---|---|---|\n| xs | `2879:150758` | `2913:177840` |\n| sm | `2913:179637` |
